<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Weekly Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  /* Bảng màu: :root là giao diện sáng; tối khi máy để chế độ tối (ô Giao diện = Tự động) hoặc khi chọn Tối */
  :root{
    --paper:#F4F6F9;
    --panel:#FFFFFF;
    --ink:#171A23;
    --ink-2:#454D5E;
    --line:#CBD2DC;
    --video:#5B4BE0;
    --up:#12874B;
    --down:#C42B62;
    --warn:#B4690E;
    --soft:#EEF1F6;
    --chip:#F0F2F6;
    --th:#EEF2F6;
    --grid:#DFE4EB;
    --dash:#D5DBE4;
    --muted:#B8BFCC;
    --accent:#2A7394;
    --heat:#2E9A63; --heat-now:#E2F3E9; --heat-now-ink:#1C7447;
    --accent-bg:#E3F1F7;
    --now-bg:#DDEFF8;
    --now-head:#2A7394;
    --now-head-ink:#FFFFFF;
    --now-line:#2A7394;
    --up-bg:#E4F5EA;
    --down-bg:#FBE9F0;
    --as-bg:#EAE7FC;
    --etc-bg:#FDF0DC;
    --prog:#3B5BDB;
    --prog-bg:#E7ECFD;
    --tip-bg:#171A23;
    --shadow:rgba(23,26,35,.12);
    --tag-bg:80% 88%;
    --tag-fg:80% 24%;
    --tag-bd:60% 62%;
    --faded:.85;
    --grid-v:#EDF0F4;
    --row-hover:#F5F8FB;
    --total-bg:#EAF2F7;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#111319;
    --panel:#1A1D25;
    --ink:#E7EAF0;
    --ink-2:#9BA3B4;
    --line:#2D323D;
    --video:#7B6CF0;
    --up:#5FD08F;
    --down:#F07AA2;
    --warn:#F2B866;
    --soft:#252A34;
    --chip:#232833;
    --th:#20242D;
    --grid:#262B35;
    --dash:#2D323D;
    --muted:#4A5160;
    --accent:#5DB3D6;
    --heat:#4FAF7C; --heat-now:#183323; --heat-now-ink:#7FD3A3;
    --accent-bg:#17303B;
    --now-bg:#15252E;
    --now-head:#2B5A6E;
    --now-head-ink:#E6F3F9;
    --now-line:#356F88;
    --up-bg:#163223;
    --down-bg:#3A1A27;
    --as-bg:#28234A;
    --etc-bg:#3A2A12;
    --prog:#93A8FF;
    --prog-bg:#1E2747;
    --tip-bg:#2A2F3B;
    --shadow:rgba(0,0,0,.4);
    --tag-bg:32% 24%;
    --tag-fg:75% 82%;
    --tag-bd:30% 36%;
    --faded:.65;
    --grid-v:#22262F;
    --row-hover:#1F232C;
    --total-bg:#19252D;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --paper:#111319;
    --panel:#1A1D25;
    --ink:#E7EAF0;
    --ink-2:#9BA3B4;
    --line:#2D323D;
    --video:#7B6CF0;
    --up:#5FD08F;
    --down:#F07AA2;
    --warn:#F2B866;
    --soft:#252A34;
    --chip:#232833;
    --th:#20242D;
    --grid:#262B35;
    --dash:#2D323D;
    --muted:#4A5160;
    --accent:#5DB3D6;
    --heat:#4FAF7C; --heat-now:#183323; --heat-now-ink:#7FD3A3;
    --accent-bg:#17303B;
    --now-bg:#15252E;
    --now-head:#2B5A6E;
    --now-head-ink:#E6F3F9;
    --now-line:#356F88;
    --up-bg:#163223;
    --down-bg:#3A1A27;
    --as-bg:#28234A;
    --etc-bg:#3A2A12;
    --prog:#93A8FF;
    --prog-bg:#1E2747;
    --tip-bg:#2A2F3B;
    --shadow:rgba(0,0,0,.4);
    --tag-bg:32% 24%;
    --tag-fg:75% 82%;
    --tag-bd:30% 36%;
    --faded:.65;
    --grid-v:#22262F;
    --row-hover:#1F232C;
    --total-bg:#19252D;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;
    padding-bottom:18px;border-bottom:2px solid var(--ink);
  }
  .masthead h1{
    font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;
  }
  .masthead p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
  .stamp{font-size:12.5px;opacity:.8}
  .picker{margin-left:auto;display:flex;align-items:center;gap:10px}
  .picker label{font-size:13.5px;color:var(--ink-2)}
  .theme-sw{display:inline-flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px;border:1px solid var(--line);flex:0 0 auto}
  .theme-sw button{display:grid;place-items:center;width:36px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);cursor:pointer;padding:0}
  .theme-sw button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .theme-sw button:hover{color:var(--ink)}
  .theme-sw button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
  .theme-sw button[aria-pressed="true"] svg{fill:currentColor;fill-opacity:.15}
  #lang{min-width:118px;font-weight:500}
  select{
    font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;min-width:210px;
  }
  select:focus-visible{outline:2px solid var(--video);outline-offset:2px}

  /* ---------- headline row ---------- */
  .headline{
    display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;margin-top:22px;
  }
  .cell{background:var(--panel);padding:18px 20px}
  .cell .k{font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .big{
    font-family:"IBM Plex Mono",monospace;font-weight:600;
    font-size:44px;line-height:1;letter-spacing:-.03em;
  }
  .mid{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:28px;line-height:1.15}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;margin-top:8px}
  .delta.note{color:var(--warn);margin-top:6px;font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;line-height:1.45}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:1px}
  .sw-v{background:var(--video)}

  /* ---------- reading ---------- */
  .reading{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;margin-top:16px;
  }
  .reading h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .why{margin:0 0 14px;padding:0 0 14px;border-bottom:1px dashed var(--line)}
  .why:last-child{margin:0;padding:0;border:0}
  .why .team{font-weight:600;font-size:14px;margin-bottom:5px}
  .why .team .n{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2);margin-left:6px}
  .why p{margin:0 0 6px;font-size:14px}
  .why-reasons{margin:0 0 8px;padding-left:18px;font-size:14px}
  .why-reasons li{margin:2px 0}
  .bars{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .chip{
    font-size:12.5px;padding:4px 9px;border-radius:6px;
    background:var(--chip);border:1px solid var(--line);
  }
  .chip b{font-family:"IBM Plex Mono",monospace;font-weight:600}

  /* ---------- chart ---------- */
  .chartbox{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 18px 8px;margin-top:16px;
  }
  .chart-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
  .chart-head h2{font-size:15px;margin:0;font-weight:600}
  .chartbox+.chartbox{margin-top:14px}
  .toolbar{display:flex;margin-top:16px}
  .hint{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
  .toggle{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px}
  .toggle button{
    font-family:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);
    padding:6px 12px;border-radius:6px;cursor:pointer;
  }
  .toggle button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
  .canvas-holder{height:284px;position:relative}

  /* ---------- member table ---------- */
  .members{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tcard header{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;
  }
  .tcard header h3{margin:0;font-size:15px;font-weight:600}
  .tcard header .sum{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-2)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 18px;font-size:14px;border-bottom:1px solid var(--grid)}
  th{font-size:12.5px;color:var(--ink-2);font-weight:500}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
  .barcell{width:34%}
  .track{height:7px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
  .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
  .vs{font-size:16px;color:var(--ink-2);font-weight:500;margin-left:2px}
  .fill{height:100%;border-radius:4px}
  .tag{font-size:11.5px;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
  .tag-hi{background:var(--up-bg);color:var(--up)}
  .tag-lo{background:var(--down-bg);color:var(--down)}
  .tag-leave{background:var(--etc-bg);color:var(--warn)}
  .tag-new{background:var(--accent-bg);color:var(--accent)}
  .tag-pm{background:var(--accent-bg);color:var(--accent)}
  .tag-solo{background:var(--soft);color:var(--ink-2)}
  .pmname{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
  .tag-as{background:var(--as-bg);color:var(--video)}
  .tag-etc{background:var(--etc-bg);color:var(--warn)}
  .empty{padding:18px;color:var(--ink-2);font-size:14px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button,.tabs a{font-family:inherit;font-size:15px;border:0;background:transparent;color:var(--ink-2);
    padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--video)}
  .tabs button:hover,.tabs a:hover{color:var(--ink)}
  .tabs a{margin-left:auto;color:var(--accent)}
  .tabs a[hidden]{display:none}

  /* ---------- PM ---------- */
  .pm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:16px}
  .pm-bar .wk{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
  .pm-bar label{font-size:13.5px;color:var(--ink-2)}
  #pm-week{min-width:0;max-width:100%;flex:1}
  .pm-sum{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--ink-2)}
  .pm-sum b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-size:18px;margin-right:4px}
  .pm-card{margin-top:16px}
  #view-perf .cs-head .ov-h{flex:1 1 240px}
  .pf-table{width:100%;border-collapse:collapse}
  .pf-table th,.pf-table td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:left;font-size:13.5px;white-space:nowrap;vertical-align:middle}
  .pf-table th{font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:var(--th)}
  .pf-table .n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .pf-table .b{font-weight:600}
  .pf-table .dim,.pf-stats .dim{color:var(--ink-2)}
  .pf-table .up{color:var(--up)} .pf-table .down{color:var(--down)}
  .pf-table tr.sel td{background:var(--accent-bg)}
  .pf-table button.pf-pick{all:unset;cursor:pointer;border-radius:6px}
  .pf-table button.pf-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pf-table .who{white-space:normal;min-width:160px;color:var(--ink-2);font-size:12.5px}
  .pf-mx th.g{text-transform:none;letter-spacing:0;text-align:center}
  .pf-mx td.c{text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;min-width:74px}
  .pf-mx td.c small{display:block;font-family:inherit;font-size:10.5px;color:var(--ink-2)}
  .pf-mx td:first-child,.pf-mx th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
  .pf-mx th:first-child{background:var(--th)}
  .pf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--grid);border-bottom:1px solid var(--grid)}
  .pf-stats div{background:var(--panel);padding:12px 18px;display:grid;gap:2px;min-width:0}
  .pf-stats span{font-size:12px;color:var(--ink-2)}
  .pf-stats b{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}
  .pf-stats small{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
  .pf-chart{position:relative;height:260px;padding:14px 18px 6px}
  #view-perf button.pf-v{all:unset;cursor:pointer;color:var(--accent);border-bottom:1px dashed currentColor}
  #view-perf button.pf-v:hover{border-bottom-style:solid}
  #view-perf button.pf-v:focus-visible,.pf-table button.sz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pf-table button.sz{display:inline-block;margin-right:6px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--accent);background:none;cursor:pointer;font-family:"IBM Plex Mono",monospace}
  .pf-table button.sz:hover{background:var(--accent-bg)}
  .pf-table button.sz::before{content:"▶ ";font-size:9px}
  .pf-table .pk{font-size:15px;font-weight:700}
  .pf-table tr.peak td{background:var(--up-bg)}
  #view-perf button.pf-it-b{all:unset;cursor:pointer;color:var(--accent);display:inline-flex;align-items:center;gap:6px;font-weight:600}
  #view-perf button.pf-it-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  #view-perf button.pf-it-b .car{display:inline-block;width:10px;font-size:11px}
  .pf-table tr.pf-exp>td{padding:0 0 10px 26px;background:var(--soft);white-space:normal}
  .pf-table.pf-sub{background:var(--panel);border:1px solid var(--grid);border-top:0}
  .pf-table.pf-sub th{background:var(--th)}
  .pf-table .flag.pkf{background:var(--video);color:var(--panel)}
  .pf-table .rej{font-size:11px;font-weight:700;color:var(--down);font-family:inherit}
  .pf-table .flag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--up-bg);color:var(--up);font-size:11px;font-weight:600;font-family:inherit}
  .pf-table td.cpt{white-space:normal;min-width:140px;max-width:260px;color:var(--ink-2);font-size:12.5px}
  .pm-scroll{overflow-x:auto}
  #pm-table th,#pm-table td{white-space:nowrap}
  #pm-table th{background:var(--th)}
  #pm-table td.pmc{font-weight:600;vertical-align:top;border-right:1px solid var(--grid)}
  #pm-table td.pmc small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
  #pm-table td.pmc small b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
  #pm-table tr.grand td{background:var(--accent-bg);font-weight:700;border-bottom:0}
  #pm-table td.it{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2)}
  #pm-table a.it-link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  #pm-table a.it-link:hover{border-bottom-color:currentColor}
  .game{--h:210;display:inline-block;font-size:13px;font-weight:500;padding:2px 9px;border-radius:999px;
    background:hsl(var(--h) var(--tag-bg));color:hsl(var(--h) var(--tag-fg));border:1px solid hsl(var(--h) var(--tag-bd))}
  .st{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--soft);color:var(--ink-2)}
  .st-prog{background:var(--prog-bg);color:var(--prog)}
  .st-done{background:var(--up-bg);color:var(--up)}
  /* ---------- Overview: PM × tuần ---------- */
  .ov-scroll{overflow-x:auto}
  #ov-table{border-collapse:separate;border-spacing:0}
  #ov-table th,#ov-table td{vertical-align:top;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:10px 12px}
  #ov-table th{background:var(--th);white-space:nowrap;font-size:12.5px}
  #ov-table th small{display:block;font-weight:400;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
  /* tuần hiện tại: đầu cột đặc màu + nhãn "Tuần này", cả cột có viền accent */
  #ov-table th.now,#cs-table th.now,#ps-table th.now{background:var(--now-head);color:var(--now-head-ink);font-weight:700}
  th.now .now-badge{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.92;margin-top:1px}
  #ov-table td.now,#cs-table td.now,#ps-table td.now{background:var(--now-bg);box-shadow:inset 2px 0 0 var(--now-line),inset -2px 0 0 var(--now-line)}
  #ov-table tr:last-child td.now,#cs-table tr:last-child td.now,#ps-table tr:last-child td.now{box-shadow:inset 2px 0 0 var(--now-line),inset -2px 0 0 var(--now-line),inset 0 -2px 0 var(--now-line)}
  #ov-table .sticky{position:sticky;left:0;z-index:1;background:var(--panel);min-width:120px;font-weight:600;white-space:nowrap}
  #ov-table th.sticky{background:var(--th);z-index:2}
  #ov-table .sticky small{display:block;font-weight:400;font-size:12px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
  #ov-table td.cell{min-width:240px;max-width:300px}
  .ov-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;padding:4px 0;color:var(--ink);text-decoration:none;font-size:13px}
  .ov-item + .ov-item{border-top:1px dashed var(--dash)}
  a.ov-item:hover .ov-cr{text-decoration:underline}
  .ov-item .game{font-size:12px;padding:1px 8px}
  .ov-item .game{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov-cr{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov-n{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right;min-width:18px}
  .ov-plan{opacity:var(--faded)}
  .ov-sch{opacity:var(--faded);font-style:italic}
  .ov-sch .game{border:1px dashed currentColor}
  .game.etc-tag{background:var(--etc-bg);color:var(--warn)}
  .yt-item{display:inline-flex;align-items:center;gap:3px;max-width:100%}
  .yt-mark{font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1;padding:3px 5px;border-radius:4px;background:#E0352B;color:#fff;flex:none}
  .yt-mark.social{background:#7C3AED}
  .cs-yt{margin-top:3px}
  .src-line{padding:0 18px 14px;margin:0;font-size:12px}
  .src-ok{color:var(--up);font-weight:600}
  .src-bad{color:var(--warn);font-weight:600}
  .ov-empty{color:var(--muted)}
  #ov-table tr.grand td{background:var(--accent-bg);font-weight:700;font-family:"IBM Plex Mono",monospace}
  #ov-table tr.grand td.sticky{background:var(--accent-bg);font-family:inherit}

  /* PM × game */
  .gchips{display:flex;flex-wrap:wrap;gap:6px}

// Data giờ cập nhật bằng file CSV export từ Notion. Được phép lại thì đổi thành true.
const NOTION_AI=false;
// Thứ tự option "Game Title" trên Notion — mỗi game một màu cố định, khớp với Creative Planner.
// Game mới thêm trên Notion mà chưa có ở đây vẫn có màu (tính từ tên), chỉ là không khớp Planner.
const GAME_ORDER=["Arrow Fever","BEHIND","Bulldozer Master","Burger Please!","Captain of Space","CrabLife",
  "Dino Universe","Downhill","Dragon Burst","Frozia","Gangster Universe","Idle Oil Empire","Lumber Chopper",
  "Match Flight","Mosquito","My Fish Shop","My Supermarket","Outlets Rush","Paper Delivery Boy","Pizza Ready",
  "Prison Life","Rush Attack","Shark Universe","Smash Down","Snake Clash","Spin Miner","Super Big Slime",
  "Suzy's Restaurant","Target Smash!","Theme park manager","Whack Stack","XP Hero"];
function gameHue(g){
  const i=GAME_ORDER.indexOf(g);
  if(i>=0) return Math.round((i*137.508+12)%360);
  let h=0; for(const c of String(g)) h=(h*31+c.charCodeAt(0))%360; return h;
}
const escH=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gameTag=g=>g?`<span class="game" style="--h:${gameHue(g)}">${escH(g)}</span>`:"—";
// Tiêu đề phụ "(YT) Game" / "(Social) Game" — video YouTube / social làm kèm game chính;
// hiện bằng nhãn đỏ (YT) hoặc tím (Social) trước tag game
const ytLabel=s=>/social/i.test(s||"")?"Social":"YT";
const ytTag=(g,tag="YT")=>`<span class="yt-item" title="${escH(T().ytTip)}"><span class="yt-mark${tag==="Social"?" social":""}">${escH(tag)}</span>${gameTag(toNotionGame(g))}</span>`;
const YT_RE=/^\s*\((YT|Social)\)/i;
const isYT=t=>YT_RE.test(t&&t.iteration||"");
const ytPrefix=t=>ytLabel((YT_RE.exec(t&&t.iteration||"")||[])[1]);
// Tách các "(YT) X" / "(Social) X" ra khỏi một ô lịch: {main: game chính, yt:[{g, tag}]}
function splitYT(v){
  const yt=[];
  let main=String(v||"").replace(/\((YT|Social)\)\s*([^\n,\/+|&]+)/gi,(m,l,g)=>{ yt.push({g:g.trim(), tag:ytLabel(l)}); return "\n"; });
  main=main.split("\n").map(x=>x.replace(/^[\s,\/+|&]+|[\s,\/+|&]+$/g,"")).filter(Boolean).join(" ").trim();
  if(!main&&yt.length) main=yt.shift().g;
  return {main, yt};
}
// PM đã rời team: không hiện trong tab PM / Overview (số của creator ở tab Creator vẫn giữ nguyên).
const HIDDEN_PM=["Avril","Khong xac dinh"];
let TASKS=null, ALL_TASKS=null;          // null = CSV chưa có cột chi tiết từng task
let pmWeek=null;
// Ngày bắt đầu của một Period, đọc từ "(MM/DD~)" trong tên.
function periodStart(name){
  const d=periodDate(name); if(!d) return null;
  const now=new Date(); let y=now.getFullYear();
  const start=new Date(y,d.m-1,d.d);
  if(start-now>180*864e5) start.setFullYear(y-1);
  if(now-start>185*864e5) start.setFullYear(y+1);
  return start;
}
function pmWeeks(){
  const set=[...new Set((TASKS||[]).map(t=>t.period))].filter(p=>periodStart(p));
  return set.sort((a,b)=>periodStart(a)-periodStart(b));
}
// " · tuần này" / " · sắp tới" cho một Period, dùng chung cho ô chọn tuần của tab Creator và PM
function weekTag(p){
  const st=periodStart(p); if(!st) return "";
  const now=new Date(), end=new Date(st.getTime()+(/W\d+W\d+/.test(p)?14:7)*864e5);
  return now>=st&&now<end?T().pm.now:(st>now?T().pm.soon:"");
}
function pmWeekLabel(p){
  const d=periodDate(p);
  return `${T().wk(String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0"))}${weekTag(p)} — ${p}`;
}
function pageLink(id){
  const m=/([0-9a-f]{32})/i.exec(String(id||"").replace(/-/g,""));
  return m?`https://app.notion.com/p/${m[1].toLowerCase()}`:null;
}
function stPill(s){
  if(!s) return "—";
  return `<span class="st ${s==="Done"?"st-done":s==="In-progress"?"st-prog":""}">${escH(s)}</span>`;
}
function fillPmWeeks(){
  const box=document.getElementById("pm-week");
  const ws=pmWeeks();
  if(!ws.includes(pmWeek)){
    const now=new Date();
    pmWeek=[...ws].reverse().find(p=>periodStart(p)<=now)||ws[ws.length-1]||null;
  }
  box.innerHTML=[...ws].reverse().map(p=>`<option value="${escH(p)}">${escH(pmWeekLabel(p))}</option>`).join("");
  box.value=pmWeek||"";
  box.disabled=!ws.length;
}
// Bảng PM × game: game nào PM đang đảm nhận (có task tuần này hoặc sắp tới) và đã làm (chỉ còn ở các tuần trước)
// Bảng PM → game: tên PM (A→Z) | các game PM đó làm. Đang đảm nhận (có task tuần này hoặc sắp tới)
// có chấm xanh và đứng trước; đã làm (chỉ còn ở các tuần trước) hiện mờ.
function renderPMGames(){
  const L=T().pm.g, table=document.getElementById("pmg-table");
  document.getElementById("pmg-title").textContent=L.title;
  document.getElementById("pmg-legend").innerHTML=escH(L.legend).replace("●",'<span class="pmg-dot"></span>');
  if(!TASKS){ table.innerHTML=`<tr><td class="empty">${T().pm.noData}</td></tr>`; return; }
  const now=new Date(), by=new Map();
  TASKS.filter(t=>t.pm&&t.game).forEach(t=>{
    if(!by.has(t.pm)) by.set(t.pm,new Map());
    const m=by.get(t.pm), st=periodStart(t.period);
    const e=m.get(t.game)||{weeks:new Set(),active:false};
    e.weeks.add(t.period); e.active=e.active||!!st&&(isNowWeek(t.period)||st>now);
    m.set(t.game,e);
  });
  let h=`<thead><tr><th>${T().ov.pm}</th><th>${L.game}</th></tr></thead><tbody>`;
  [...by.keys()].sort((a,b)=>a.localeCompare(b)).forEach(pm=>{
    const list=[...by.get(pm).entries()].sort((a,b)=>b[1].active-a[1].active||b[1].weeks.size-a[1].weeks.size||a[0].localeCompare(b[0]));
    h+=`<tr><td class="pmg-name">${escH(pm)}</td><td><div class="pmg-list">${list.map(([g,e])=>
      `<span class="pmg-item ${e.active?"on":"off"}" title="${escH((e.active?L.active:L.done)+" · "+L.meta(e.weeks.size))}">${e.active?`<span class="pmg-dot"></span>`:""}${gameTag(g)}</span>`).join("")}</div></td></tr>`;
  });
  table.innerHTML=h+"</tbody>";
}
// Lịch PM theo tuần (giống lịch ở tab Creator): "Theo PM" = PM × tuần → game · creator,
// "Theo game" = game × tuần → PM (creator). PM = PM của task Notion, chưa gắn thì theo lịch PM×Creator.
let PS_MODE="pm";
function renderPMSchedule(){
  const L=T().pm.s, card=document.getElementById("ps-card");
  if(!SCHEDULE){ card.hidden=true; return; }
  card.hidden=false;
  document.getElementById("ps-title").textContent=L.title;
  document.getElementById("ps-note").textContent=L.note;
  const [b1,b2]=document.querySelectorAll("#ps-mode button");
  b1.textContent=L.byPM; b2.textContent=L.byGame;
  b1.setAttribute("aria-pressed",PS_MODE==="pm"); b2.setAttribute("aria-pressed",PS_MODE==="game");
  const now=new Date(), cols=SCHEDULE.cols, SOLO="\u0000";
  const colCls=c=>{ const end=new Date(c.start.getTime()+7*864e5); return now>=c.start&&now<end?"now":(end<=now?"past":""); };
  // mọi ô lịch: {key, pm, game, etc, creator}
  const cells=[];
  SCHEDULE.people.forEach(p=>cols.forEach(c=>{
    const v=p.byDate[c.key]||""; if(isBlank(v)) return;
    const etc=/^etc$/i.test(v);
    const pm=pmOfCell(p,c,v).pm||SOLO;
    cells.push({key:c.key, pm, game:etc?"ETC":toNotionGame(v), etc, creator:p.name});
    ytOf(p,c.key).forEach(y=>cells.push({key:c.key, pm:y.pm||SOLO, game:toNotionGame(y.g), etc:false, yt:true, ytTag:y.tag, creator:p.name}));
  }));
  const tag=x=>x.etc?`<span class="game etc-tag" title="${escH(T().ov.etcTip)}">${escH(T().ov.etc)}</span>`:x.yt?ytTag(x.game,x.ytTag):gameTag(x.game);
  const pmName=k=>k===SOLO?L.solo:k;
  let h=`<thead><tr><th class="sticky">${PS_MODE==="pm"?L.pm:L.game}</th>`+cols.map(c=>`<th class="${colCls(c)==="now"?"now":""}">${escH(T().wk(String(c.start.getDate()).padStart(2,"0")+"/"+String(c.start.getMonth()+1).padStart(2,"0")))}${colCls(c)==="now"?`<span class="now-badge">${escH(T().ov.nowBadge)}</span>`:""}</th>`).join("")
    +(PS_MODE==="game"?`<th>${L.weeks}</th>`:"")+`</tr></thead><tbody>`;
  if(PS_MODE==="pm"){
    const pms=[...new Set(cells.map(x=>x.pm))].sort((a,b)=>a===SOLO?1:b===SOLO?-1:a.localeCompare(b));
    pms.forEach(k=>{
      h+=`<tr><td class="sticky">${escH(pmName(k))}</td>`+cols.map(c=>{
        const list=cells.filter(x=>x.pm===k&&x.key===c.key).sort((a,b)=>a.game.localeCompare(b.game)||a.creator.localeCompare(b.creator));
        return `<td class="${colCls(c)}">${list.length?list.map(x=>`<div class="ps-item">${tag(x)}<span class="ps-cr">${escH(x.creator)}</span></div>`).join(""):`<span class="ov-empty">—</span>`}</td>`;
      }).join("")+`</tr>`;
    });
  }else{
    const games=new Map();
    cells.filter(x=>!x.etc).forEach(x=>{ const k=gameKey(x.game); if(!games.has(k)) games.set(k,{g:x.game,list:[],weeks:new Set()}); const e=games.get(k); e.list.push(x); e.weeks.add(x.key); });
    [...games.values()].sort((a,b)=>b.weeks.size-a.weeks.size||a.g.localeCompare(b.g)).forEach(e=>{
      h+=`<tr><td class="sticky">${gameTag(e.g)}</td>`+cols.map(c=>{
        const list=e.list.filter(x=>x.key===c.key);
        const by=new Map(); list.forEach(x=>{ if(!by.has(x.pm)) by.set(x.pm,[]); by.get(x.pm).push(x.creator+(x.yt?" · "+x.ytTag:"")); });
        return `<td class="${colCls(c)}">${by.size?[...by.entries()].map(([k,cr])=>`<div class="ps-item"><span class="ps-pm${k===SOLO?" solo":""}">${escH(k===SOLO?L.solo:"PM "+k)}</span><small class="cs-pmi">${cr.map(escH).join(", ")}</small></div>`).join(""):`<span class="ov-empty">—</span>`}</td>`;
      }).join("")+`<td class="cnt">${e.weeks.size}</td></tr>`;
    });
  }
  const table=document.getElementById("ps-table");
  table.innerHTML=h+"</tbody>";
  const box=document.getElementById("ps-scroll"), cur=table.querySelector("th.now"), st=table.querySelector("th.sticky");
  if(cur&&st) box.scrollLeft=Math.max(0,cur.offsetLeft-st.offsetWidth-(cur.previousElementSibling?cur.previousElementSibling.offsetWidth:0)*2);
}

const SCHEDULE_TEAM=t=>/베트남/.test(t)&&/\bUA\b/.test(t)&&!/AI/.test(t);   // chỉ "🇻🇳 베트남 — UA"
let SCHEDULE=null, SCHEDULE_DONE=false;   // {live, people:[{name, byDate:{"M/D":game}}]}
function csvRows(text){
  const rows=[];let row=[],cell="",q=false;
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function parseSchedule(text,live){
  const rows=csvRows(text);
  const hi=rows.findIndex(r=>(r[1]||"").trim()==="담당자");
  if(hi<0) throw new Error("no header");
  const dates=rows[hi].map((c,i)=>{ if(i<2) return null; const m=/(\d{1,2})[\/.](\d{1,2})\s*$/.exec(c.trim()); return m?`${+m[1]}/${+m[2]}`:null; });
  const people=rows.slice(hi+1).filter(r=>SCHEDULE_TEAM(r[0]||"")&&(r[1]||"").trim()).map(r=>{
    const byDate={}, ytBy={};
    dates.forEach((d,i)=>{ if(!d) return; const sp=splitYT((r[i]||"").trim()); byDate[d]=sp.main; if(sp.yt.length) ytBy[d]=sp.yt; });
    return {name:r[1].trim(), byDate, ytBy};
  });
  if(!people.length) throw new Error("no rows");
  const cols=dates.filter(Boolean).map(k=>({key:k, start:periodStart(`(${k}~)`)})).filter(c=>c.start);
  return {live, people, cols};
}

function parsePMSched(text,live){

  if(hi<0) throw new Error("no header");
  const dates=rows[hi].map((c,i)=>{ if(i<1) return null; const m=/(\d{1,2})[\/.](\d{1,2})\s*$/.exec(c.trim()); return m?`${+m[1]}/${+m[2]}`:null; });
  const people=rows.slice(hi+1).filter(r=>(r[0]||"").trim()).map(r=>{

      const lines=v.split("\n").map(x=>x.trim()).filter(Boolean);
      const pl=lines.find(x=>/^PM\s*:/i.test(x)), raw=pl?pl.replace(/^PM\s*:/i,"").trim():undefined;

async function fetchFirst(list,parse,raw){

      const res=await fetch(u,{cache:"no-store"});

// Gộp lịch PM × Creator vào SCHEDULE: game + (YT) theo 4-Week Loop; PM × Creator cho PM (khi cùng game) và lấp ô Loop trống
function mergeSchedules(){
  if(!PMSCHED) return;
  if(!SCHEDULE) SCHEDULE={live:false, people:[], cols:[]};
  const keys=new Set(SCHEDULE.cols.map(c=>c.key));
  PMSCHED.cols.forEach(c=>{ if(!keys.has(c.key)){ SCHEDULE.cols.push(c); keys.add(c.key); } });
  SCHEDULE.cols.sort((a,b)=>a.start-b.start);
  PMSCHED.people.forEach(pp=>{
    let per=SCHEDULE.people.find(x=>x.name.toLowerCase()===pp.name.toLowerCase());
    if(!per){ per={name:pp.name, byDate:{}, ytBy:{}}; SCHEDULE.people.push(per); }
    per.loop={...per.byDate}; per.pmBy={}; per.ytBy=per.ytBy||{};
    Object.entries(pp.byDate).forEach(([k,v])=>{
      const lg=per.byDate[k];
      if(isBlank(lg)){ if(v.game) per.byDate[k]=v.game; per.pmBy[k]=v; }          // Loop trống → lấy game ở PM×Creator
      else if(gameKey(toNotionGame(lg))===gameKey(toNotionGame(v.game))) per.pmBy[k]=v;   // cùng game → lấy PM
      // khác game: Loop đúng hơn (được sửa thường xuyên) → giữ game Loop, bỏ PM của PM×Creator
      if(v.yt&&v.yt.length) per.ytBy[k]=[...(per.ytBy[k]||[]),...v.yt];
    });
  });
}

function ytOf(per,key){

function pmOfCell(per,col,v){

const toNotionGame=g=>GAME_ORDER.find(x=>gameKey(x)===gameKey(g))||String(g||"").trim();

function scheduledFor(person,period){
  const st=periodStart(period); if(!st) return "";
  const span=/W\d+W\d+/.test(period)?2:1;
  for(let k=0;k<span;k++){
    const d=new Date(st.getTime()+k*7*864e5), v=person.byDate[`${d.getMonth()+1}/${d.getDate()}`];

// cột của Sheet ↔ Period trên Notion: cùng ngày bắt đầu, hoặc là tuần thứ 2 của kỳ gộp W1W2
function periodForCol(col){
  return ALL_TASKS?[...new Set(ALL_TASKS.map(t=>t.period))].find(pp=>{
    const st=periodStart(pp); if(!st) return false;
    if(+st===+col.start) return true;
    return /W\d+W\d+/.test(pp)&&+new Date(st.getTime()+7*864e5)===+col.start;
  }):null;
}
// PM của ô lịch: lấy từ task Notion cùng tuần + creator + game; nếu chưa có task thì đoán
// theo lần gần nhất creator đó làm game đó, rồi tới lần gần nhất có ai làm game đó.
function pmForCell(name,col,sch){
  if(!ALL_TASKS||isBlank(sch)||/^etc$/i.test(sch)) return null;
  const k=gameKey(sch), ok=t=>t.pm&&!HIDDEN_PM.includes(t.pm)&&gameKey(t.game)===k;
  const p=periodForCol(col);
  const real=p&&ALL_TASKS.find(t=>t.period===p&&t.creators.includes(name)&&ok(t));
  if(real) return {pm:real.pm,guess:false};
  const latest=list=>list.sort((a,b)=>(+periodStart(b.period)||0)-(+periodStart(a.period)||0))[0];
  const g=latest(ALL_TASKS.filter(t=>ok(t)&&t.creators.includes(name)))||latest(ALL_TASKS.filter(ok));
  return g?{pm:g.pm,guess:true}:null;
}

function pmRealForCell(name,col,sch){
  if(!ALL_TASKS||isBlank(sch)) return null;
  const p=periodForCol(col); if(!p) return null;
  const mine=ALL_TASKS.filter(t=>t.period===p&&t.creators.includes(name)&&t.pm&&!HIDDEN_PM.includes(t.pm));
  const hit=mine.find(t=>gameKey(t.game)===gameKey(sch))||mine[0];
  return hit?hit.pm:null;

function planQuota(name,game,date){
  const base=planBase(name,game,date);
  if(!date) return base;
  const ex=excIn(date,new Date(date.getTime()+7*864e5)), lv=ex.leave[String(name).toLowerCase()];
  if(lv) return lv.support!=null?lv.support:lv.quota!=null?lv.quota:Math.max(0,base-(lv.days||0));
  return ex.adj&&!GAME_QUOTA[gameKey(game)]?Math.max(0,base+(ex.adj.bonus||0)):base;
}
function planBase(name,game,date){
  const t=TEAMS[0], gq=GAME_QUOTA[gameKey(game)]; if(gq) return gq;
  if(name===t.etc) return t.etcQuota||t.quota;
  const arr=t.people[name]||[], first=arr.findIndex(v=>v!==null&&v!==undefined);
  if(first<0) return RAMP[0];
  const li=WEEKS.length-1, lst=periodStart(WEEKS[li].full);
  const idx=lst?li+Math.round((date-lst)/(7*864e5)):li+1;
  if(first>0){ const r=idx-first; if(r>=0&&r<RAMP.length) return RAMP[r]; }
  return t.quota;
}

  if((ALL_TASKS||[]).some(t=>t.creators.some(x=>x.toLowerCase()===k))||Object.keys(TEAMS[0].people).some(x=>x.toLowerCase()===k)) return "UA";
  if(AI_NUMS.some(t=>t.creator.split(",").some(x=>x.trim().toLowerCase()===k))) return "AI";

const cnRanges=s=>String(s||"").split(/[,;\n]/).map(x=>{ const m=x.match(/(\d{4,})\s*(?:~|-|–)\s*(\d{2,})/);
  if(m){ let a=+m[1], b=+m[2]; if(m[2].length<m[1].length) b=+(m[1].slice(0,m[1].length-m[2].length)+m[2]); return [a,b]; }
  const n=x.match(/\d{4,}/); return n?[+n[0],+n[0]]:null; }).filter(Boolean);
function svQuery(q){
  q=String(q||"").trim(); if(!q) return null;
  if(/^\d{1,3}$/.test(q)) return n=>String(n).endsWith(q);
  const r=cnRanges(q);
  if(r.length) return n=>r.some(([a,b])=>n>=a&&n<=b);
  if(/^\d+$/.test(q)) return n=>String(n).includes(q);
  return ()=>false;
}
function notionFor(gk,n){
  const out=[];
  (ALL_TASKS||[]).forEach(t=>{ if(cnKey(t.game||t.iteration.replace(YT_RE,"").trim(),false)!==gk) return;
    if(cnRanges(t.creative).some(([a,b])=>n>=a&&n<=b)) out.push({who:t.creators.join(", "), it:t.iteration, wk:weekShort(t.period), href:pageLink(t.pageId), ai:false, st:t.status}); });
  AI_NUMS.forEach(t=>{ if(!t.game||cnKey(t.game,false)!==gk) return;
    if(cnRanges(t.creative).some(([a,b])=>n>=a&&n<=b)) out.push({who:t.creator, it:t.iteration, wk:periodDate(t.period)?weekShort(t.period):t.period, href:null, ai:true}); });
  return out;
}

const driveFolderUrl=id=>`https://drive.google.com/drive/folders/${encodeURIComponent(id)}`;
// Chọn game (giống ô Tìm video Creative) → hiện link thư mục game + thư mục video, copy được
function renderDriveGames(){
  const L=T().dg, tbl=document.getElementById("dg-table"), sel=document.getElementById("dg-game");
  document.getElementById("dg-title").textContent=L.title;
  document.getElementById("dg-game-l").textContent=L.game;
  if(!DGAMES){ tbl.innerHTML=""; return; }
  const known=[...new Set([...GAME_ORDER,...(ALL_TASKS||[]).map(t=>t.game).filter(Boolean)])];
  const gname=g=>{ const k=DRIVE_ALIAS[gameKey(g)]||gameKey(g); return known.find(x=>gameKey(x)===k)||g; };
  const hasVid=r=>!!(r["Videos folder"]||+r.Videos>0);
  const byName=(a,b)=>gname(a.Game).localeCompare(gname(b.Game));
  const vids=DGAMES.filter(hasVid).sort(byName), other=DGAMES.filter(r=>!hasVid(r)).sort((a,b)=>(a.Game.startsWith("#")-b.Game.startsWith("#"))||byName(a,b));
  const opt=r=>`<option value="${escH(r.Game)}">${escH(gname(r.Game))}${gameKey(gname(r.Game))!==gameKey(r.Game)?` (${escH(r.Game)})`:""}</option>`;
  sel.innerHTML=`<option value="">${escH(L.pick)}</option><option value="*">${escH(L.allVid)}</option>`+
    `<optgroup label="${escH(L.grpVid)}">${vids.map(opt).join("")}</optgroup><optgroup label="${escH(L.grpOther)}">${other.map(opt).join("")}</optgroup>`;
  sel.value=DG_SEL;
  const rows=DG_SEL==="*"?[...vids].sort((a,b)=>(+b.Videos||0)-(+a.Videos||0)):DGAMES.filter(r=>r.Game===DG_SEL);
  const df=d=>d?d.split("-").reverse().join("/"):"";
  const link=(id,lab)=>id?`<a class="fl" href="${driveFolderUrl(id)}" target="_blank" rel="noopener">${escH(lab)} ↗</a><button type="button" class="cp" data-copy="${escH(driveFolderUrl(id))}">${escH(L.copy)}</button>`:`<span class="dim">—</span>`;
  tbl.innerHTML=rows.length?`<thead><tr><th>${L.game}</th><th>${L.folder}</th><th>${L.vids}</th><th>${L.n}</th><th>${L.last}</th><th>${L.up}</th></tr></thead><tbody>`+
    rows.map(r=>{ const ng=gname(r.Game), isK=ng!==r.Game||known.includes(ng);
      return `<tr><td>${isK?gameTag(ng):escH(r.Game)}${isK&&gameKey(ng)!==gameKey(r.Game)?` <span class="dim">(${escH(r.Game)})</span>`:""}</td>`+
        `<td>${link(r.Folder,L.open)}</td><td>${link(r["Videos folder"],L.open)}</td><td class="n">${escH(r.Videos)}</td><td class="n">${escH(r["Last number"])}</td><td>${df(r["Last upload"])}</td></tr>`; }).join("")+`</tbody>`:"";
  document.getElementById("dg-msg").textContent=DG_SEL?`${L.note} ${df(DONE_SCAN)})`:L.hint;
}
document.getElementById("dg-game").addEventListener("change",e=>{ DG_SEL=e.target.value; renderDriveGames(); });
document.getElementById("dg-table").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-copy]"); if(!b) return;
  try{ await navigator.clipboard.writeText(b.dataset.copy); }catch(err){ const a=document.createElement("textarea"); a.value=b.dataset.copy; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }

function renderDone(){
  renderSearch(); renderDriveGames();
  const L=T().done;
  document.getElementById("dn-title").textContent=L.title;
  document.getElementById("dn-note").textContent=L.note;
  const mb=document.querySelectorAll("#dn-mode button"), tb=document.querySelectorAll("#dn-team button");
  [L.week,L.month,L.game].forEach((x,i)=>{ mb[i].textContent=x; mb[i].setAttribute("aria-pressed",mb[i].dataset.mode===DN_MODE); });
  [L.ua,L.ai,L.all].forEach((x,i)=>{ tb[i].textContent=x; tb[i].setAttribute("aria-pressed",tb[i].dataset.team===DN_TEAM); });
  document.getElementById("dn-src").textContent=DONE_SCAN?L.src(DONE_SCAN.split("-").reverse().join("/")):"";
  const tbl=document.getElementById("dn-table");
  if(!DONE||!DONE.length){ tbl.innerHTML=`<tbody><tr><td class="sticky">${escH(DONE?L.none:"…")}</td></tr></tbody>`; return; }
  const team={}; DONE.forEach(v=>{ if(!(v.creator in team)) team[v.creator]=creatorTeam(v.creator); });
  const vids=DONE.filter(v=>DN_TEAM==="all"||team[v.creator]===DN_TEAM);
  const pad=n=>String(n).padStart(2,"0");
  const monday=d=>{ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
  const today=new Date(); let cols, colOf, isNow=()=>false, label;
  if(DN_MODE==="game"){
    const cnt={}; vids.forEach(v=>cnt[v.game]=(cnt[v.game]||0)+1);
    cols=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]); colOf=v=>v.game; label=g=>{ const k=DRIVE_ALIAS[gameKey(g)]; return toNotionGame(k?GAME_ORDER.find(x=>gameKey(x)===k)||g:g); };
  }else if(DN_MODE==="week"){
    const m0=monday(today); cols=[];
    for(let i=11;i>=0;i--){ const d=new Date(m0); d.setDate(d.getDate()-7*i); cols.push(d.toISOString().slice(0,10)); }
    const key=d=>{ const m=monday(d); return new Date(m.getTime()-m.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
    cols=cols.map(c=>key(new Date(c+"T12:00:00"))); colOf=v=>key(v.date); isNow=c=>c===key(today);
    // nhãn W như Notion: tuần thuộc tháng chứa ngày thứ 5, W = thứ tự tuần trong tháng đó
    label=c=>{ const d=new Date(c+"T12:00:00"), th=new Date(d); th.setDate(d.getDate()+3);
      return [`W${Math.ceil(th.getDate()/7)}`, `${d.getDate()}/${d.getMonth()+1}`]; };
  }else{
    const ms=[...new Set(vids.map(v=>v.date.getFullYear()+"-"+pad(v.date.getMonth()+1)))].sort();
    cols=ms; colOf=v=>v.date.getFullYear()+"-"+pad(v.date.getMonth()+1);
    const cur=today.getFullYear()+"-"+pad(today.getMonth()+1); isNow=c=>c===cur;
    label=c=>[c.slice(0,4), L.mon(+c.slice(5))];
  }
  const ci={}; cols.forEach((c,i)=>ci[c]=i);
  const m={}; vids.forEach(v=>{ const i=ci[colOf(v)]; if(i===undefined) return; (m[v.creator]=m[v.creator]||Array(cols.length).fill(0))[i]++; });
  const people=Object.keys(m).sort((a,b)=>(team[a]+"").localeCompare(team[b]+"")||m[b].reduce((s,x)=>s+x,0)-m[a].reduce((s,x)=>s+x,0));
  const max=Math.max(1,...people.flatMap(p=>m[p]));
  const nowI=cols.findIndex(c=>isNow(c));
  const cell=(n,i)=>`<td${i===nowI?' class="now"':""}${n?` style="background:color-mix(in srgb, var(--heat) ${Math.round(14+46*n/max)}%, var(--panel))"`:""}>${n||""}</td>`;
  const head=c=>{ const lb=label(c); if(DN_MODE==="game") return escH(lb);
    return (isNow(c)?`<span class="badge">${escH(DN_MODE==="week"?T().ov.nowBadge:L.thisMonth)}</span>`:"")+`<span class="w">${escH(lb[0])}</span><span class="d">${escH(lb[1])}</span>`; };
  const sum=a=>a.reduce((s,x)=>s+x,0);
  const tot=cols.map((_,i)=>sum(people.map(p=>m[p][i])));
  tbl.innerHTML=`<thead><tr><th class="sticky">${escH(L.creator)}</th>`+
    cols.map(c=>`<th class="${DN_MODE==="game"?"g":""}${isNow(c)?" now":""}">${head(c)}</th>`).join("")+`<th class="tot">${escH(L.total)}</th></tr></thead><tbody>`+
    people.map(p=>`<tr><td class="sticky">${escH(p)}${DN_TEAM==="all"?`<small>${escH(team[p])}</small>`:""}</td>${m[p].map(cell).join("")}<td class="tot">${sum(m[p])}</td></tr>`).join("")+
    `<tr class="grand"><td class="sticky">${escH(L.grand)}</td>${tot.map((n,i)=>`<td${i===nowI?' class="now"':""}>${n||""}</td>`).join("")}<td class="tot">${sum(tot)}</td></tr></tbody>`;
  const sc=document.getElementById("dn-scroll"); if(DN_MODE!=="game") sc.scrollLeft=sc.scrollWidth;
}
document.getElementById("dn-mode").addEventListener("click",e=>{ const b=e.target.closest("button[data-mode]"); if(b){ DN_MODE=b.dataset.mode; renderDone(); } });
document.getElementById("dn-team").addEventListener("click",e=>{ const b=e.target.closest("button[data-team]"); if(b){ DN_TEAM=b.dataset.team; renderDone(); } });

async function excCall(body){

    st:{vids:"CVR 있는 영상",avg:"게임 평균 CVR",last:n=>"이터레이션 "+n,best:"Peak CVR"},
    chAvg:"평균 CVR", chMax:"Peak CVR", noIt:"이터레이션 없음",
    src:(d,n,m)=>`출처: ${d} Crebo 내보내기 · CVR = AOS CVR (WW) · CVR 있는 영상 ${n}개 · 크리에이터는 Google 드라이브 기준(9x16)${m?`, 드라이브에 없는 영상 ${m}개는 Crebo 이름 사용`:""}.`,

    none:"CVR 데이터가 없습니다 (data/cvr.csv).", pick:"자세히 보기",

    topNote:n=>`이 게임에서 Peak CVR이 가장 높은 영상 ${n}개입니다. 9x16 / 1x1 / 16x9를 누르면 드라이브 영상을 볼 수 있고, 다른 표의 Creative 번호를 눌러도 영상이 열립니다.`, noVid:"드라이브에 없음"}
};
const PT=()=>PF_TXT[LANG]||PF_TXT.en;
const PF_RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
let PF=null, PF_GAME="", PF_EXP="", PF_SCOPE="all", PF_VIDS=[], PF_OPEN=null;  // PF_OPEN: iteration đang mở ngay trong bảng
// video trên Drive của một dòng CVR (cùng game + số; ưu tiên bản UA)
function pfVideo(r){
  if(!DONE) return null; const gk=gameKey(r.game);
  const hit=DONE.filter(v=>String(v.n)===r.num&&(DRIVE_ALIAS[gameKey(v.game)]||gameKey(v.game))===gk);
  return hit.find(v=>v.type==="UA")||hit[0]||null;
}
// số Creative bấm được (mở video) nếu có trên Drive
function pfNum(r){ const v=pfVideo(r); if(!v||!Object.keys(v.links||{}).length) return escH(r.num);
  PF_VIDS.push(v); return `<button type="button" class="pf-v" data-v="${PF_VIDS.length-1}" title="${escH(PT().watch)}">${escH(r.num)}</button>`; }
fetch("data/cvr.csv",{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
  const rows=parseCSV(t||"");
  PF_EXP=(rows[0]||{}).Exported||"";
  PF=rows.map(r=>({game:r.Game, it:+r.Iteration||0, num:r.Number, cvr:r.CVR!==""&&!isNaN(+r.CVR)?+r.CVR:null, status:r.Status,
    creator:r.Creator||"—", src:r.Source, date:r.Date||"", top:r.Top||""}));
  if(VIEW==="perf") renderPerf();
}).catch(()=>{ PF=[]; });
const pfOrd=n=>!n?"—":n+(n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"})[n%10]||"th");
const pfAvg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const pfMed=a=>{ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
const pfF=v=>v===null||v===undefined?"—":v.toFixed(2);
const pfD=v=>v===null||v===undefined||isNaN(v)?`<span class="dim">—</span>`:`<span class="${v>0.005?"up":v<-0.005?"down":"dim"}">${v>0?"+":v<0?"−":"±"}${Math.abs(v).toFixed(2)}</span>`;
function pfGroup(rows,keyf){ const m=new Map(); rows.forEach(r=>{ const k=keyf(r); if(!m.has(k)) m.set(k,[]); m.get(k).push(r); }); return m; }
function pfStats(rows){
  const t=rows.filter(r=>r.cvr!==null), v=t.map(r=>r.cvr);
  const best=t.reduce((b,r)=>!b||r.cvr>b.cvr?r:b,null);
  return {n:t.length, rej:rows.filter(r=>r.status==="Rejected").length, avg:pfAvg(v), med:pfMed(v), best};
}
// bảng video (CVR cao -> thấp, rejected cuối); peak=true thì dòng đầu gắn nhãn Peak
function pfVidTable(rows,peak,cls){
  const L=PT(), C=L.cols, dfm=d=>d?d.split("-").reverse().join("/"):"";
  const list=rows.filter(r=>r.cvr!==null).sort((a,b)=>b.cvr-a.cvr||a.num.localeCompare(b.num)).concat(peak?rows.filter(r=>r.cvr===null):[]);
  return {n:list.length, html:`<table class="pf-table ${cls||""}"><thead><tr><th class="n">${L.rank}</th><th class="n">CVR</th><th>${L.num}</th><th>${C.cr}</th><th>${C.it}</th><th>${L.date}</th><th>${L.watch}</th></tr></thead><tbody>`+
    list.map((r,i)=>{ const v=pfVideo(r); let w=`<span class="dim">${escH(L.noVid)}</span>`;
      if(v&&Object.keys(v.links||{}).length){ PF_VIDS.push(v); const vi=PF_VIDS.length-1;
        w=["9x16","1x1","16x9"].filter(k=>v.links[k]).map(k=>`<button type="button" class="sz" data-v="${vi}" data-k="${k}">${k}</button>`).join(""); }
      const pk=peak&&i===0&&r.cvr!==null;
      return `<tr${pk?' class="peak"':""}><td class="n dim">${r.cvr!==null?i+1:""}</td><td class="n pk">${r.cvr!==null?pfF(r.cvr):`<span class="rej">${escH(r.status)}</span>`}${pk?`<span class="flag pkf">${escH(L.peak)}</span>`:""}</td><td class="n">${escH(r.num)}${r.top?`<span class="flag" title="${escH(L.top)}: ${escH(r.top)}">${escH(L.top)}</span>`:""}</td>`+
        `<td class="b">${escH(r.creator)}</td><td>${escH(pfOrd(r.it))}</td><td>${dfm(r.date)}</td><td>${w}</td></tr>`; }).join("")+`</tbody></table>`};
}
function renderPerf(){
  const L=PT(), C=L.cols; PF_VIDS=[];
  document.getElementById("pf-ov-title").textContent=L.ovTitle;
  document.getElementById("pf-game-l").textContent=L.game;
  document.getElementById("pf-mx-title").textContent=L.mxTitle;
  document.getElementById("pf-cr-note").textContent=L.crNote;
  document.getElementById("pf-mx-note").textContent=L.mxNote;
  const gt=document.getElementById("pf-games");
  if(!PF||!PF.length){ gt.innerHTML=`<tbody><tr><td>${escH(PF?L.none:"…")}</td></tr></tbody>`; return; }
  const games=[...pfGroup(PF,r=>r.game)].map(([g,rows])=>{
    const st=pfStats(rows), its=[...new Set(rows.filter(r=>r.cvr!==null&&r.it).map(r=>r.it))].sort((a,b)=>a-b);
    const last=its[its.length-1], prev=its[its.length-2];
    const la=last?pfAvg(rows.filter(r=>r.it===last&&r.cvr!==null).map(r=>r.cvr)):null;
    const pa=prev?pfAvg(rows.filter(r=>r.it===prev&&r.cvr!==null).map(r=>r.cvr)):null;
    const recent=rows.reduce((d,r)=>r.date>d?r.date:d,"");
    return {g,rows,st,its,last,la,chg:la!==null&&pa!==null?la-pa:null,recent};
  }).sort((a,b)=>b.st.n-a.st.n);
  if(!PF_GAME||!games.some(x=>x.g===PF_GAME)) PF_GAME=[...games].sort((a,b)=>b.recent.localeCompare(a.recent))[0].g;
  const nCrebo=PF.filter(r=>r.src==="Crebo"&&r.cvr!==null).length;
  document.getElementById("pf-src").textContent=L.src(PF_EXP.split("-").reverse().join("/"),PF.filter(r=>r.cvr!==null).length,nCrebo);
  gt.innerHTML=`<thead><tr><th>${C.game}</th><th class="n">${C.its}</th><th class="n">${C.vids}</th><th class="n">${C.avg}</th><th class="n">${C.last}</th><th class="n">${C.lastAvg}</th><th class="n">${C.chg}</th></tr></thead><tbody>`+
    games.map(x=>`<tr${x.g===PF_GAME?' class="sel"':""}><td><button type="button" class="pf-pick" data-g="${escH(x.g)}" title="${escH(L.pick)}">${gameTag(x.g)}</button></td>`+
      `<td class="n">${x.its.length||"—"}</td><td class="n">${x.st.n}</td><td class="n b">${pfF(x.st.avg)}</td><td class="n">${pfOrd(x.last)}</td><td class="n">${pfF(x.la)}</td><td class="n">${pfD(x.chg)}</td></tr>`).join("")+`</tbody>`;
  // ---- game đang chọn
  const sel=document.getElementById("pf-game");
  sel.innerHTML=games.map(x=>`<option value="${escH(x.g)}">${escH(x.g)} (${x.st.n})</option>`).join(""); sel.value=PF_GAME;
  const G=games.find(x=>x.g===PF_GAME);
  document.getElementById("pf-it-title").textContent=L.itTitle(PF_GAME);
  document.getElementById("pf-cr-title").textContent=L.crTitle(PF_GAME);
  const byIt=[...pfGroup(G.rows,r=>r.it)].map(([it,rows])=>({it,rows,st:pfStats(rows),who:[...new Set(rows.map(r=>r.creator))].sort()})).sort((a,b)=>a.it-b.it);
  const tested=byIt.filter(x=>x.st.n&&x.it);
  const b=G.st.best;
  document.getElementById("pf-stats").innerHTML=
    `<div><span>${escH(L.st.vids)}</span><b>${G.st.n}</b><small>${G.its.length} ${escH(C.its.toLowerCase())}</small></div>`+
    `<div><span>${escH(L.st.avg)}</span><b>${pfF(G.st.avg)}</b><small>${escH(C.med)} ${pfF(G.st.med)}</small></div>`+
    `<div><span>${escH(L.st.last(pfOrd(G.last)))}</span><b>${pfF(G.la)}</b><small>${pfD(G.chg)} <span class="dim">${escH(C.chg)}</span></small></div>`+
    `<div><span>${escH(L.st.best)}</span><b>${pfF(b&&b.cvr)}</b><small>${b?`${pfNum(b)} · ${escH(b.creator)} · ${escH(pfOrd(b.it))}`:""}</small></div>`;
  // biểu đồ: cột = CVR TB từng iteration, đường = cao nhất
  const cv=document.getElementById("pf-chart");
  if(charts.perf){ charts.perf.destroy(); delete charts.perf; }
  if(window.Chart&&tested.length){
    const ink=getCSS("--ink-2"), grid=getCSS("--grid");
    const selIt=PF_OPEN, base=getCSS("--heat"), hot=getCSS("--video");
    charts.perf=new Chart(cv,{type:"line",data:{labels:tested.map(x=>pfOrd(x.it)),datasets:[
      {label:L.chMax,data:tested.map(x=>x.st.best?x.st.best.cvr:null),borderColor:base,borderWidth:2.5,tension:.3,cubicInterpolationMode:"monotone",
        fill:true,backgroundColor:`color-mix(in srgb, ${base} 14%, transparent)`,
        pointBackgroundColor:tested.map(x=>x.it===selIt?hot:base),pointBorderColor:getCSS("--panel"),pointBorderWidth:1.5,
        pointRadius:tested.map(x=>x.it===selIt?7:4),pointHoverRadius:7,pointHitRadius:12}]},
      options:{responsive:true,maintainAspectRatio:false,animation:PF_RM?false:{duration:400},interaction:{mode:"index",intersect:false},
        onClick:(e,els)=>{ if(!els.length) return; PF_OPEN=tested[els[0].index].it; setTimeout(()=>{ renderPerf(); pfToOpen(); },0); }, // vẽ lại sau khi Chart.js xử lý xong cú bấm
        onHover:(e,els)=>{ e.native.target.style.cursor=els.length?"pointer":"default"; },
        plugins:{legend:{display:false},tooltip:{callbacks:{label:it=>`${L.chMax} ${pfF(it.raw)}`,
          afterBody:it=>{ const x=tested[it[0].dataIndex]; return [`${x.st.best.num} · ${x.st.best.creator}`,`${x.st.n} video · ${L.clickIt}`]; }}}},
        scales:{x:{ticks:{color:ink,autoSkip:true,maxRotation:0},grid:{display:false}},y:{beginAtZero:false,grace:"8%",ticks:{color:ink},grid:{color:grid},title:{display:true,text:L.chMax,color:ink}}}}});
    cv.setAttribute("aria-label",`${L.chMax} · ${L.itTitle(PF_GAME)}: `+tested.map(x=>`${pfOrd(x.it)} ${pfF(x.st.best&&x.st.best.cvr)}`).join(", "));
  }
  const itRows=[...byIt].reverse();
  document.getElementById("pf-it").innerHTML=`<thead><tr><th>${C.it}</th><th class="n">${C.vids}</th><th class="n">${C.rej}</th><th class="n">${C.avg}</th><th class="n">${C.med}</th><th class="n">${C.best}</th><th class="n">${C.chg}</th><th>${C.who}</th></tr></thead><tbody>`+
    itRows.map(x=>{ const i=tested.indexOf(x), pv=i>0?tested[i-1].st.avg:null, open=x.it&&PF_OPEN===x.it;
      const sub=open?`<tr class="pf-exp"><td colspan="8">${pfVidTable(x.rows,true,"pf-sub").html}</td></tr>`:"";
      return `<tr${open?' class="sel"':""}><td class="b">${x.it?`<button type="button" class="pf-it-b" data-it="${x.it}" aria-expanded="${!!open}" title="${escH(L.clickIt)}"><span class="car" aria-hidden="true">${open?"▾":"▸"}</span>${pfOrd(x.it)}</button>`:escH(L.noIt)}</td><td class="n">${x.st.n}</td><td class="n">${x.st.rej||""}</td><td class="n b">${pfF(x.st.avg)}</td><td class="n">${pfF(x.st.med)}</td>`+
        `<td class="n">${x.st.best?`${pfF(x.st.best.cvr)} <span class="dim">${pfNum(x.st.best)} · ${escH(x.st.best.creator)}</span>`:"—"}</td>`+
        `<td class="n">${x.st.avg!==null&&pv!==null?pfD(x.st.avg-pv):pfD(null)}</td><td class="who">${escH(x.who.join(", "))}</td></tr>`+sub; }).join("")+`</tbody>`;
  document.getElementById("pf-chart-note").textContent=L.clickIt+".";
  // ---- video work nhất
  document.getElementById("pf-top-title").textContent=L.topTitle(PF_GAME);
  if(PF_SCOPE!=="last") PF_SCOPE="all";
  const sIt=PF_SCOPE==="last"?G.last:null;
  document.getElementById("pf-top-title").textContent=sIt!==null?L.itVids(pfOrd(sIt),PF_GAME):L.topTitle(PF_GAME);
  document.getElementById("pf-scope").innerHTML=[["all",L.scope.all],["last",`${L.scope.last} (${pfOrd(G.last)})`]]
    .map(([k,t])=>`<button type="button" data-s="${k}" aria-pressed="${k===PF_SCOPE}">${escH(t)}</button>`).join("");
  const TOPN=15, tv=pfVidTable(sIt===null?G.rows:G.rows.filter(r=>r.it===sIt),sIt!==null);
  if(sIt===null){ const t=document.createElement("div"); t.innerHTML=tv.html; [...t.querySelectorAll("tbody tr")].slice(TOPN).forEach(r=>r.remove()); tv.html=t.innerHTML; tv.n=Math.min(tv.n,TOPN); }
  document.getElementById("pf-top").innerHTML=tv.html.replace(/^<table[^>]*>|<\/table>$/g,"");
  document.getElementById("pf-top-note").textContent=sIt!==null?L.clickIt+".":L.topNote(tv.n);
  // ---- từng người trong game đang chọn
  const people=[...pfGroup(G.rows,r=>r.creator)].map(([c,rows])=>{ const st=pfStats(rows);
    const its=[...new Set(rows.filter(r=>r.cvr!==null&&r.it).map(r=>r.it))].sort((a,b)=>a-b), li=its[its.length-1];
    return {c,st,li,la:li?pfAvg(rows.filter(r=>r.it===li&&r.cvr!==null).map(r=>r.cvr)):null}; }).filter(x=>x.st.n||x.st.rej)
    .sort((a,b)=>b.st.n-a.st.n||a.c.localeCompare(b.c));
  const avs=people.map(x=>x.st.avg).filter(v=>v!==null), lo=Math.min(...avs), hi=Math.max(...avs);
  const shade=(v,lo,hi)=>v===null?"":` style="background:color-mix(in srgb, var(--heat) ${Math.round(10+40*((v-lo)/((hi-lo)||1)))}%, var(--panel))"`;
  document.getElementById("pf-cr").innerHTML=`<thead><tr><th>${C.cr}</th><th class="n">${C.vids}</th><th class="n">${C.rej}</th><th class="n">${C.avg}</th><th class="n">${C.vsGame}</th><th class="n">${C.best}</th><th class="n">${C.lastIt}</th></tr></thead><tbody>`+
    people.map(x=>`<tr><td class="b">${escH(x.c)}</td><td class="n">${x.st.n}</td><td class="n">${x.st.rej||""}</td><td class="n b"${shade(x.st.avg,lo,hi)}>${pfF(x.st.avg)}</td>`+
      `<td class="n">${x.st.avg!==null?pfD(x.st.avg-G.st.avg):pfD(null)}</td><td class="n">${x.st.best?`${pfF(x.st.best.cvr)} <span class="dim">${pfNum(x.st.best)}</span>`:"—"}</td>`+
      `<td class="n">${x.li?`${pfOrd(x.li)} · ${pfF(x.la)}`:"—"}</td></tr>`).join("")+`</tbody>`;
  // ---- ma trận người × game
  const gcols=games.filter(x=>x.st.n);
  const cell={}; gcols.forEach(x=>pfGroup(x.rows.filter(r=>r.cvr!==null),r=>r.creator).forEach((rows,c)=>{ (cell[c]=cell[c]||{})[x.g]={avg:pfAvg(rows.map(r=>r.cvr)),n:rows.length}; }));
  const rng={}; gcols.forEach(x=>{ const v=Object.values(cell).map(o=>o[x.g]).filter(Boolean).map(o=>o.avg); rng[x.g]=[Math.min(...v),Math.max(...v)]; });

    names.map(c=>`<tr><td class="b">${escH(c)}</td>${gcols.map(x=>{ const o=cell[c][x.g]; return o?`<td class="c"${shade(o.avg,...rng[x.g])}>${pfF(o.avg)}<small>${o.n}</small></td>`:`<td class="c"></td>`; }).join("")}</tr>`).join("")+`</tbody>`;
}

let VIEW="creator";
function showView(v){
  VIEW=v;
  ["creator","pm","num","done","perf"].forEach(k=>{
    const on=k===v, tab=document.getElementById("tab-"+k);
    tab.setAttribute("aria-selected",on); tab.tabIndex=on?0:-1;
    document.getElementById("view-"+k).hidden=!on;
  });
  // ô chọn tuần trên masthead chỉ dành cho tab Creator; tab PM có ô chọn riêng (gồm cả tuần sắp tới)
  document.getElementById("week").hidden=v!=="creator";
  document.getElementById("lbl-week").hidden=v!=="creator";
  if(v==="pm") renderPM();
  else if(v==="num") renderNum();

  else if(v==="perf") renderPerf();
  else if(charts.video) charts.video.resize();
  try{ localStorage.setItem("ct-view",v); }catch(e){}
}

// ---------------------------------------------------------------- helpers
function roster(team,i){
  return Object.entries(team.people)
    .filter(([,arr])=>arr[i]!==null && arr[i]!==undefined)
    .map(([name,arr])=>({name,v:arr[i]}));
}
function totalOf(team,i){
  const r=roster(team,i);
  return r.length ? r.reduce((s,p)=>s+p.v,0) : null;
}
function headOf(team,i){return roster(team,i).length}

const EXC_API="https://script.google.com/macros/s/AKfycbz7C9OtHX4sq-8gERduiMe1pkTTpa1F82bnGO91t5wrS-lLlwrwSM4_WnlPBt7r6J_2Fg/exec";

function excDate(v){

  if(m[3]) return new Date(m[3].length===2?2000+ +m[3]:+m[3], mm-1, dd);

const excNum=v=>{ const n=parseFloat(String(v||"").replace(/[−–]/g,"-").replace(",",".")); return isFinite(n)?n:null; };
function parseExc(t){ return excRows(parseCSV(t)); }
function excRows(list){

    const g=k=>r[k]??r[k.toLowerCase()]??"";

    return {date:d, all:EXC_ALL.test(who), name:who, days:excNum(g("Days off")), target:excNum(g("Target")),
      support:excNum(g("Dev/Art")), change:excNum(g("Team change")), note:note3, hasNote:!!(note||g("Note EN")||g("Note KO"))};

// Các dòng ngoại lệ rơi vào kỳ i (từ ngày bắt đầu kỳ i tới trước kỳ sau; kỳ cuối = 7 ngày)
function excAt(i){

function excIn(st,en){

    if(r.all){ const c=r.change||0;
      out.adj={bonus:c, bonusEtc:c, note:r.hasNote?r.note:{vi:"Điều chỉnh chỉ tiêu",en:"Target adjustment",ko:"목표 조정"}}; }
    else { const n=r.days;
      out.leave[r.name.toLowerCase()]={name:r.name, days:n||0, quota:r.target, support:r.support,
        note:r.hasNote?r.note:{vi:n?`Nghỉ ${n} ngày`:"Chỉ tiêu riêng",en:n?`Off ${n} day${n>1?"s":""}`:"Own target",ko:n?`${n}일 휴무`:"개별 목표"}}; }

async function loadExc(){

// Vai trò ETC có chuẩn riêng (12) và không nhận phần cộng thêm của kỳ gộp.
// Người mới vào đội: kỳ đầu tiên chỉ tiêu 2 video, kỳ thứ hai 6, từ kỳ thứ ba mới theo chuẩn.
// "Mới" = kỳ đầu tiên có số của người đó nằm sau kỳ đầu của bảng (người có số từ kỳ đầu là người cũ).
const RAMP=[2,6];
function rampQuota(team,name,i){
  if(name===team.etc) return null;

// Game có chỉ tiêu riêng: tuần nào creator làm game này thì chỉ tiêu tuần đó theo số ở đây (thay cho 8 / ETC 12).
// Khoá là tên game viết thường, bỏ dấu cách/ký tự (gameKey). Thêm game mới vào đây khi cần.
const GAME_QUOTA={hypereels:24};
// Game của creator trong một tuần theo lịch (4-Week Loop / PM×Creator), tính theo ngày bắt đầu tuần
function schedGameOn(name,date){
  if(!SCHEDULE||!date) return "";
  const per=SCHEDULE.people.find(p=>p.name.toLowerCase()===name.toLowerCase()); if(!per) return "";
  return per.byDate[`${date.getMonth()+1}/${date.getDate()}`]||"";

// Chỉ tiêu riêng theo game ở kỳ i (Notion trước, chưa có task thì theo lịch); null = không có
function gameQuotaInfo(name,i,date){
  const w=WEEKS[i]; let r=null;
  const take=g=>{ const v=GAME_QUOTA[gameKey(g)]; if(v&&(!r||v>r.q)) r={q:v,game:String(g).trim()}; };
  if(w&&ALL_TASKS) ALL_TASKS.forEach(t=>{ if(t.period===w.full&&t.creators.includes(name)) take(t.game); });
  if(!r) take(schedGameOn(name,date||(w?periodStart(w.full):null)));

}
function gameQuotaOf(name,i,date){ const r=gameQuotaInfo(name,i,date); return r?r.q:null; }
function quotaFor(team,name,i){
  const lv=leaveOf(name,i);

  return baseQuota(team,name,i);
}
// Chỉ tiêu khi không tính nghỉ phép: game chỉ tiêu riêng → người mới → ETC → chuẩn (+ điều chỉnh cả đội)
function baseQuota(team,name,i){
  const gq=gameQuotaOf(name,i);
  if(gq!==null) return gq;
  const rq=rampQuota(team,name,i);
  if(rq!==null) return rq;

    ? (team.etcQuota||team.quota)+bonusEtcAt(i)
    : quotaAt(team,i);
}
function supportAt(team,i){return team.support?team.support+bonusAt(i):null}

function pmOf(team,name,i){

// Hai chiều độc lập:
//  1. Theo SỐ LƯỢNG: dưới chỉ tiêu / đạt chuẩn / vượt mức / có dev/art (đúng mốc) / ETC.
//     Vượt mức = hơn chuẩn nhưng không trùng mốc dev/art, nên 9–11 video cũng là vượt mức.
//  2. Theo PM: có PM = làm chung; không có PM nào = tự làm (solo).
// Một người có thể vừa vượt mức vừa có PM.
function kindOf(team,name,v,i){

  if(name===team.etc) return "etc";

  roster(team,i).forEach(p=>{

// Kỳ đang diễn ra = hôm nay chưa qua hết kỳ đó. Kỳ gộp dạng "W1W2" kéo dài 2 tuần.
function periodRange(i){
  const w=WEEKS[i]; if(!w) return null;
  const m=/\((\d{1,2})\/(\d{1,2})/.exec(w.full||"");
  if(!m) return null;
  const now=new Date();
  let y=now.getFullYear();
  const start=new Date(y,+m[1]-1,+m[2]);
  if(start-now>180*864e5) start.setFullYear(y-1);      // kỳ cuối năm trước
  const days=/W\d+W\d+/.test(w.full)?14:7;
  const end=new Date(start.getTime()+days*864e5);
  return {start,end};

// Các kỳ của tháng đã có số và đã kết thúc. Tuần đang làm chưa cộng vào số tháng, hết tuần mới cộng.

function monthStats(team,m){

  const tot=ws.reduce((s,i)=>s+totalOf(team,i),0);
  const tgt=ws.reduce((s,i)=>s+targetOf(team,i),0);
  const per=ws.reduce((s,i)=>s+avgOf(team,i),0)/ws.length;

  TEAMS.forEach(t=>{
    const now=totalOf(t,i);
    if(now!==null) grand+=now;
    if(prev>=0){
      const before=totalOf(t,prev);
      if(now!==null&&before!==null){base+=now;prevSum+=before;comparable=true;}
    }

        ? `<div class="delta flat">${prev<0?T().firstWeek:T().noPrev}</div>`

      ${bonusAt(i)?`<div class="delta note">${weekAdj(i)?T().adjNote(escH(weekAdjNote(i)),bonusAt(i),bonusEtcAt(i)!==0):T().mergedNote(bonusAt(i),bonusEtcAt(i)!==0)}</div>`:""}

    </div>`];

  TEAMS.forEach(t=>{

    const dd=(now===null||before===null)?null:now-before;
    const h=headOf(t,i), a=avgOf(t,i), g=targetOf(t,i), hit=hitOf(t,i);
    cells.push(`<div class="cell">
      <div class="k"><span class="swatch sw-v"></span>${t.name}</div>
      <div class="mid">${now===null?T().notEntered:now}<span class="vs">${now===null?"":T().needed(g)}</span></div>
      <div class="delta ${hit===null?"flat":(hit>=1?"up":"down")}">

      </div>
      <div class="delta flat" style="margin-top:3px">
        ${dd===null?T().noPrev:T().vsPrev(signed(dd),h)}
      </div>
      ${t.support&&now!==null?(()=>{const sp=splitOf(t,i);
        return `<div class="delta flat" style="margin-top:3px">
          ${T().assistLine(sp.nAssisted,sp.assisted,sp.nOver)}${sp.nPM?" · "+T().pmLine(sp.nPM,roster(t,i).length):""}
        </div>`;})():""}

  });
  if(WEEKS[i].note) cells[0]=cells[0].replace("</div>`","</div>`");
  const hl=document.getElementById("headline");

}

      </p>`;
    let supLine="";

      const s1=splitOf(t,i), s0=splitOf(t,prev);
      const dAss=s1.assisted-s0.assisted;
      supLine=`<p style="color:var(--ink-2);font-size:13.5px">
        ${T().supLine(supportAt(t,i),s0.nAssisted,s1.nAssisted,s0.assisted,s1.assisted,signed(dAss),s0.nOver,s1.nOver,t.etc,t.people[t.etc][prev]??"—",t.people[t.etc][i]??"—")}
      </p>`;
    }
    const chips=movers.slice(0,4).map(m=>{
      const note=m.joined?T().joined:m.left?T().left:"";
      return `<span class="chip">${m.name} <b class="${cls(m.d)}">${signed(m.d)}</b>${note}</span>`;
    }).join("");

    return `<div class="why">
      <div class="team">${t.name}<span class="n">${T().teamHead(before,now,signed(dTot))}</span></div>
      <p>${verdict}</p>
      ${reasonLine}

        ${T().splitLine(signed(effHead,1),signed(effRate,1))}
      </p>
      ${quotaLine}
      ${supLine}
      ${chips?`<div class="bars">${chips}</div>`:""}
    </div>`;
  }).join("");
  box.innerHTML=out;
}

let mode="total";
const charts={};
const SHADE={pm:"#3E8FB0",solo:null,over:"#8F82EA",assisted:"#B7ADF3",etc:"#D89B3C"};

function stackData(t){
  // 4 lớp theo số lượng: trong chuẩn / vượt mức / có dev/art / ETC. PM xem ở bảng và phần đầu.
  const keys=["solo","over","assisted","etc"];
  const acc={};keys.forEach(k=>acc[k]=[]);
  WEEKS.forEach((_,i)=>{
    if(totalOf(t,i)===null){keys.forEach(k=>acc[k].push(null));return;}
    const sp=splitOf(t,i);
    acc.solo.push(sp.solo);
    acc.over.push(sp.over);
    acc.assisted.push(sp.assisted);
    acc.etc.push(sp.etc);
  });
  return acc;
}
function plainData(t){
  return WEEKS.map((_,i)=> mode==="total"
    ? totalOf(t,i)
    : (avgOf(t,i)===null?null:Math.round(avgOf(t,i)*10)/10));
}
function targetSeries(t){
  return WEEKS.map((_,i)=> totalOf(t,i)===null ? null
    : (mode==="total" ? targetOf(t,i)
       : Math.round(targetOf(t,i)/headOf(t,i)*10)/10));
}
function monthBars(t){
  return MONTHS.map(m=>{const st=monthStats(t,m);return st?Math.round(st.avgWeek*10)/10:null});
}
function monthTargets(t){
  return MONTHS.map(m=>{
    const ws=doneWeeks(t,m);
    if(!ws.length) return null;
    return Math.round(ws.reduce((s,i)=>s+targetOf(t,i),0)/ws.length*10)/10;
  });
}
// Số tuần của một tháng: tuần (bắt đầu thứ Hai) thuộc tháng có ngày thứ Năm của nó —
// đúng cách đội đặt tên kỳ ("Oct W1 (09/28~)" là tuần đầu tháng 10, "Oct W5 (10/26~)" là tuần cuối).
function weeksInMonth(mon,year){
  let n=0;
  for(let d=new Date(year,mon-1,1);d.getMonth()===mon-1;d.setDate(d.getDate()+1)) if(d.getDay()===4) n++;
  return n;
}
// Dự kiến cả tháng hiện tại — chỉ là dự kiến theo KPI, không dùng số thực tế, không trừ nghỉ phép:
// mỗi tuần của tháng × KPI từng người (8 video/tuần, ETC — Miko — 12, người mới 2 → 6 → 8).
function monthProjection(t){
  const now=new Date(), k=MONTHS.indexOf(monthOfWeek(WEEKS.length-1)); if(k<0) return null;
  const m=MONTHS[k], mon=parseInt(String(m.label).replace(/\D+/g,""),10); if(!mon) return null;
  const year=now.getFullYear()+(mon<now.getMonth()-5?1:mon>now.getMonth()+7?-1:0);
  const total=weeksInMonth(mon,year), done=doneWeeks(t,m);
  // các "ô tuần" của tháng: kỳ đã có trên Notion (kỳ gộp W1W2 = 2 tuần) rồi tới các tuần chưa có kỳ
  const slots=[]; m.weeks.forEach(i=>{ const w=/W\d+W\d+/.test(WEEKS[i].full)?2:1; for(let j=0;j<w;j++) slots.push(i); });
  for(let j=1;slots.length<total;j++) slots.push(WEEKS.length-1+j);
  const names=roster(t,WEEKS.length-1).map(r=>r.name);
  const last=WEEKS.length-1, lastSt=periodStart(WEEKS[last].full);
  const kpi=(n,idx)=>{
    // game chỉ tiêu riêng (Hypereels 24): kỳ đã có thì xem Notion/lịch, tuần sau đó xem lịch
    const gq=idx<=last?gameQuotaOf(n,idx):(lastSt?gameQuotaOf(n,-1,new Date(lastSt.getTime()+(idx-last)*7*864e5)):null);
    if(gq!==null) return gq;
    if(n===t.etc) return t.etcQuota||t.quota;
    const arr=t.people[n]||[], first=arr.findIndex(v=>v!==null&&v!==undefined);
    if(first<0||idx<first) return 0;                      // chưa vào đội
    const r=first>0?idx-first:RAMP.length;
    return r<RAMP.length?RAMP[r]:t.quota;
  };
  const per={}; let sum=0, rest=0;
  names.forEach(n=>{ per[n]=slots.reduce((s,idx)=>s+kpi(n,idx),0); sum+=per[n];
    rest+=slots.filter(idx=>!done.includes(idx)).reduce((s,idx)=>s+kpi(n,idx),0); });
  const doneSum=done.reduce((s,i)=>s+totalOf(t,i),0);
  return {k,month:m,total,doneWeeks:done.length,doneSum,rest,per,sum};
}
function monthTotals(t){return MONTHS.map(m=>{const st=monthStats(t,m);return st?st.total:null})}
function monthTargetSums(t){
  // Tháng hiện tại: chỉ tiêu cả tháng = chỉ tiêu các kỳ đã xong + số tuần còn lại × KPI một tuần của đội
  const pj=monthProjection(t);
  return MONTHS.map((m,k)=>{const ws=doneWeeks(t,m);const v=ws.length?ws.reduce((s,i)=>s+targetOf(t,i),0):null;
    return pj&&k===pj.k?(v||0)+pj.rest:v;});
}

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else if(c==='"') q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>{
    const o={};head.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;
  });
}

// "[W3] Sep W4 (09/21~)" -> {m:9,d:21}
function periodDate(name){
  const m=/\((\d{1,2})\/(\d{1,2})/.exec(name||"");
  return m?{m:+m[1],d:+m[2]}:null;
}
const MONTH_VI=n=>`Tháng ${n}`;
// Tháng của một kỳ theo tên Period trên Notion ("Sep W1W2 (08/31~)" là tháng 9, "July W1 (06/29~)" là tháng 7),
// vì đội đặt kỳ theo tháng làm việc chứ không theo ngày bắt đầu. Không có tên tháng thì lấy tháng của ngày bắt đầu.
function monthOfPeriod(full){
  const k=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i.exec(full||"");
  if(k) return ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(k[1].toLowerCase())+1;
  return (periodDate(full)||{m:0}).m;
}

function importCSV(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error("empty");
  const need=["Period","Team","Creator","Video Count"];
  const miss=need.filter(h=>!(h in rows[0]));
  if(miss.length) throw new Error("cols:"+miss.join(", "));

  const team=TEAMS[0];
  const mine=rows.filter(r=>r.Team===team.name);        // chỉ đội đang theo dõi
  if(!mine.length) throw new Error("noteam:"+team.name);

  const known=WEEKS.map(w=>w.full);
  const lastKnown=periodDate(known[known.length-1])||{m:0,d:0};
  const dayOf=d=>d.m*30.5+d.d;
  const base=dayOf(lastKnown);

  // Chỉ nhận kỳ mới nằm trong khoảng 120 ngày sau kỳ cuối đã biết. Nhờ vậy các kỳ
  // cũ (tháng 4, tháng 5 chưa nhập Video Count) không bị kéo ngược vào bảng.
  const seen=new Set(), fresh=[];
  mine.forEach(r=>{
    const p=r.Period;
    if(!p||seen.has(p)||known.includes(p)) return;
    seen.add(p);
    const d=periodDate(p);
    if(!d) return;
    // Kỳ chưa bắt đầu chỉ là kế hoạch nhập trước (Creative Planner) — không tính vào sản lượng.
    const st=periodStart(p);
    if(st&&st>new Date()) return;
    let gap=dayOf(d)-base;
    if(gap<0) gap+=365;
    if(gap>0&&gap<=120) fresh.push(p);
  });
  fresh.sort((a,b)=>{
    const ga=(dayOf(periodDate(a))-base+365)%365;
    const gb=(dayOf(periodDate(b))-base+365)%365;
    return ga-gb;
  });

  const order=[...known,...fresh];
  const idx=Object.fromEntries(order.map((p,i)=>[p,i]));
  const people={}, pms={}, warn=[], noCount=[];
  const hasPMcol = "PM" in rows[0];
  // Ô PM trống, "[]" hay "null" đều nghĩa là không có PM — task đó tính là solo.
  const cleanPM=v=>{v=(v||"").trim();return (v===""||v==="[]"||v.toLowerCase()==="null")?"":v;};

  mine.forEach(r=>{
    if(!r.Period||idx[r.Period]===undefined) return;
    const creators=r.Creator.split(",").map(x=>x.trim()).filter(Boolean);
    if(!creators.length) return;
    const raw=r["Video Count"];
    if(!raw){ noCount.push(`${r.Period} / ${creators.join(", ")}`); return; }
    let n;
    if(/^\d+$/.test(raw)) n=+raw;
    else { const m=/\d+/.exec(raw); if(!m) return; n=+m[0]; warn.push(`${r.Period} · ${creators[0]}: "${raw}"`); }
    const share=n/creators.length;
    const pm=hasPMcol?cleanPM(r.PM):"";
    creators.forEach(c=>{
      people[c]=people[c]||new Array(order.length).fill(null);
      people[c][idx[r.Period]]=(people[c][idx[r.Period]]||0)+share;
      if(pm){
        pms[c]=pms[c]||new Array(order.length).fill("");
        const cur=pms[c][idx[r.Period]];
        const set=new Set(cur?cur.split(", "):[]);
        pm.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>set.add(x));
        pms[c][idx[r.Period]]=[...set].join(", ");
      }
    });
  });

  const names=Object.keys(people);
  if(!names.length) throw new Error("nodata");
  names.forEach(c=>people[c]=people[c].map(v=>v===null?null:Math.round(v)));

  let last=order.length;
  while(last>0&&!names.some(c=>people[c][last-1]!==null)) last--;

  const newWeeks=order.slice(0,last).map(full=>{
    const old=WEEKS.find(w=>w.full===full);
    if(old) return old;                                  // giữ nguyên bonus, bonusEtc, label
    const d=periodDate(full);
    return {label:`Tuần ${String(d.d).padStart(2,"0")}/${String(d.m).padStart(2,"0")}`, full};
  });

  const bucket={}, newMonths=[];
  newWeeks.forEach((w,i)=>{
    const key=`Tháng ${monthOfPeriod(w.full)}`;
    if(!(key in bucket)){bucket[key]=newMonths.length;newMonths.push({label:key,weeks:[]});}
    newMonths[bucket[key]].weeks.push(i);
  });

  const sorted={};
  names.sort((a,b)=>{
    const sa=people[a].slice(0,last).reduce((s,v)=>s+(v||0),0);
    const sb=people[b].slice(0,last).reduce((s,v)=>s+(v||0),0);
    return sb-sa;
  }).forEach(c=>sorted[c]=people[c].slice(0,last));

  const pmOut={};
  Object.keys(sorted).forEach(c=>{ if(pms[c]) pmOut[c]=pms[c].slice(0,last); });
  // Chi tiết từng task cho tab PM — chỉ có khi CSV mang thêm cột Game Title (định dạng mới).
  const tasks=("Game Title" in rows[0])?mine.filter(r=>r.Period&&periodDate(r.Period)).map(r=>({
    period:r.Period, pm:cleanPM(r.PM), game:r["Game Title"]||"", iteration:r.Iteration||"",
    creators:(r.Creator||"").split(",").map(x=>x.trim()).filter(Boolean),
    count:/^\d+$/.test(r["Video Count"]||"")?+r["Video Count"]:null,
    status:r.Status||"", pageId:r["Page ID"]||"", creative:r["Creative number"]||""})):null;
  return {weeks:newWeeks,months:newMonths,people:sorted,pm:pmOut,hasPMcol,warn,noCount,
          tasks:tasks&&tasks.filter(t=>!HIDDEN_PM.includes(t.pm)), allTasks:tasks,
          fresh:fresh.filter(f=>order.indexOf(f)<last)};
}

function applyImport(res){
  WEEKS.length=0; res.weeks.forEach(w=>WEEKS.push(w));
  MONTHS.length=0; res.months.forEach(m=>MONTHS.push(m));
  const t=TEAMS[0];
  Object.keys(t.people).forEach(k=>delete t.people[k]);
  Object.entries(res.people).forEach(([k,v])=>t.people[k]=v);
  // CSV cũ chưa có cột PM thì giữ nguyên thông tin PM đang nhúng, đừng xoá trắng.
  if(res.hasPMcol){
    t.pm={}; Object.entries(res.pm).forEach(([k,v])=>t.pm[k]=v);
  }
  const sel=document.getElementById("week");
  sel.innerHTML="";
  WEEKS.forEach((w,i)=>{const o=document.createElement("option");o.value=i;sel.appendChild(o);});
  sel.value=WEEKS.length-1;
}

// Nếu repo có data/latest.csv thì lấy số từ đó, coi như nguồn mới nhất.
// Không có hoặc lỗi thì dùng khối dữ liệu nhúng sẵn — trang vẫn chạy bình thường.
async function loadLiveCSV(){
  let res;
  try{
    res=await fetch("data/latest.csv",{cache:"no-store"});
    if(!res.ok) return null;
  }catch(e){ return null; }          // mở bằng file:// hoặc chưa có file
  const text=await res.text();
  let parsed;
  try{ parsed=importCSV(text); }
  catch(e){ console.warn("data/latest.csv không đọc được:",e.message); return null; }
  applyImport(parsed);
  TASKS=parsed.tasks; ALL_TASKS=parsed.allTasks;
  const lm=res.headers.get("last-modified");
  const when=lm?new Date(lm):new Date();
  return {stamp:when.toISOString().slice(0,16).replace("T"," ")+" UTC",
          fresh:parsed.fresh};
}

const sysDark=()=>!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(v){
  if(v==="light"||v==="dark") document.documentElement.setAttribute("data-theme",v);
  else document.documentElement.removeAttribute("data-theme");
  const cur=(v==="light"||v==="dark")?v:(sysDark()?"dark":"light");
  document.querySelectorAll("#theme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===cur));
}
function repaint(){ if(Object.keys(charts).length) refreshCharts(); update(); renderCreatorSchedule(); if(VIEW==="pm") renderPM(); if(VIEW==="num") renderNum(); if(VIEW==="perf") renderPerf(); }
(()=>{ let v=null; try{ v=localStorage.getItem(THEME_KEY); }catch(e){} applyTheme(v); })();
document.getElementById("theme").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;

// ---------------------------------------------------------------- kéo bảng bằng chuột
// Bảng rộng (.ov-scroll, .pm-scroll): nhấn giữ chuột trong bảng rồi kéo ngang/dọc để xem, khỏi kéo thanh cuộn.
// Chỉ áp dụng cho chuột; điện thoại vuốt như bình thường. Kéo xong thì không tính là bấm link.
(function(){
  let box=null, sx=0, sy=0, sl=0, st=0, moved=false;
  document.addEventListener("pointerdown",e=>{
    moved=false;
    if(e.pointerType!=="mouse"||e.button!==0) return;
    const b=e.target.closest(".ov-scroll,.pm-scroll");
    if(!b||b.scrollWidth<=b.clientWidth||e.target.closest("button,select,input")) return;
    box=b; sx=e.clientX; sy=e.clientY; sl=b.scrollLeft; st=window.scrollY; moved=false;
  });
  document.addEventListener("pointermove",e=>{
    if(!box) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<5) return;
    if(!moved){ moved=true; box.classList.add("dragging"); }
    box.scrollLeft=sl-dx; window.scrollTo(window.scrollX,st-dy);
    e.preventDefault();
  });
  const end=()=>{ if(box){ box.classList.remove("dragging"); box=null; } };
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",end);
  // chặn cú bấm ngay sau khi kéo (để không mở nhầm link Notion)
  document.addEventListener("click",e=>{ if(moved&&e.target.closest(".ov-scroll,.pm-scroll")){ e.preventDefault(); e.stopPropagation(); moved=false; } },true);
})();
