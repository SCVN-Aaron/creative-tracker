<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Weekly Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  /* Bảng màu: :root là giao diện sáng; tối khi máy để chế độ tối (ô Giao diện = Tự động) hoặc khi chọn Tối */
  :root{
    --paper:#F4F6F9;
    --panel:#FFFFFF;
    --ink:#171A23;
    --ink-2:#454D5E;
    --line:#CBD2DC;
    --video:#5B4BE0;
    --up:#12874B;
    --down:#C42B62;
    --warn:#B4690E;
    --soft:#EEF1F6;
    --chip:#F0F2F6;
    --th:#EEF2F6;
    --grid:#DFE4EB;
    --dash:#D5DBE4;
    --muted:#B8BFCC;
    --accent:#2A7394;
    --accent-bg:#E3F1F7;
    --now-bg:#DDEFF8;
    --on-accent:#FFFFFF;
    --up-bg:#E4F5EA;
    --down-bg:#FBE9F0;
    --as-bg:#EAE7FC;
    --etc-bg:#FDF0DC;
    --prog:#3B5BDB;
    --prog-bg:#E7ECFD;
    --tip-bg:#171A23;
    --shadow:rgba(23,26,35,.12);
    --tag-bg:80% 88%;
    --tag-fg:80% 24%;
    --tag-bd:60% 62%;
    --faded:.85;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#111319;
    --panel:#1A1D25;
    --ink:#E7EAF0;
    --ink-2:#9BA3B4;
    --line:#2D323D;
    --video:#7B6CF0;
    --up:#5FD08F;
    --down:#F07AA2;
    --warn:#F2B866;
    --soft:#252A34;
    --chip:#232833;
    --th:#20242D;
    --grid:#262B35;
    --dash:#2D323D;
    --muted:#4A5160;
    --accent:#5DB3D6;
    --accent-bg:#17303B;
    --now-bg:#173040;
    --on-accent:#0B1A21;
    --up-bg:#163223;
    --down-bg:#3A1A27;
    --as-bg:#28234A;
    --etc-bg:#3A2A12;
    --prog:#93A8FF;
    --prog-bg:#1E2747;
    --tip-bg:#2A2F3B;
    --shadow:rgba(0,0,0,.4);
    --tag-bg:32% 24%;
    --tag-fg:75% 82%;
    --tag-bd:30% 36%;
    --faded:.65;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --paper:#111319;
    --panel:#1A1D25;
    --ink:#E7EAF0;
    --ink-2:#9BA3B4;
    --line:#2D323D;
    --video:#7B6CF0;
    --up:#5FD08F;
    --down:#F07AA2;
    --warn:#F2B866;
    --soft:#252A34;
    --chip:#232833;
    --th:#20242D;
    --grid:#262B35;
    --dash:#2D323D;
    --muted:#4A5160;
    --accent:#5DB3D6;
    --accent-bg:#17303B;
    --now-bg:#173040;
    --on-accent:#0B1A21;
    --up-bg:#163223;
    --down-bg:#3A1A27;
    --as-bg:#28234A;
    --etc-bg:#3A2A12;
    --prog:#93A8FF;
    --prog-bg:#1E2747;
    --tip-bg:#2A2F3B;
    --shadow:rgba(0,0,0,.4);
    --tag-bg:32% 24%;
    --tag-fg:75% 82%;
    --tag-bd:30% 36%;
    --faded:.65;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;
    padding-bottom:18px;border-bottom:2px solid var(--ink);
  }
  .masthead h1{
    font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;
  }
  .masthead p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
  .stamp{font-size:12.5px;opacity:.8}
  .picker{margin-left:auto;display:flex;align-items:center;gap:10px}
  .picker label{font-size:13.5px;color:var(--ink-2)}
  #theme{min-width:0;font-weight:500}
  #lang{min-width:118px;font-weight:500}
  select{
    font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;min-width:210px;
  }
  select:focus-visible{outline:2px solid var(--video);outline-offset:2px}

  /* ---------- headline row ---------- */
  .headline{
    display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;margin-top:22px;
  }
  .cell{background:var(--panel);padding:18px 20px}
  .cell .k{font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .big{
    font-family:"IBM Plex Mono",monospace;font-weight:600;
    font-size:44px;line-height:1;letter-spacing:-.03em;
  }
  .mid{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:28px;line-height:1.15}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;margin-top:8px}
  .delta.note{color:var(--warn);margin-top:6px;font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;line-height:1.45}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:1px}
  .sw-v{background:var(--video)}

  /* ---------- reading ---------- */
  .reading{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;margin-top:16px;
  }
  .reading h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .why{margin:0 0 14px;padding:0 0 14px;border-bottom:1px dashed var(--line)}
  .why:last-child{margin:0;padding:0;border:0}
  .why .team{font-weight:600;font-size:14px;margin-bottom:5px}
  .why .team .n{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2);margin-left:6px}
  .why p{margin:0 0 6px;font-size:14px}
  .bars{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .chip{
    font-size:12.5px;padding:4px 9px;border-radius:6px;
    background:var(--chip);border:1px solid var(--line);
  }
  .chip b{font-family:"IBM Plex Mono",monospace;font-weight:600}

  /* ---------- chart ---------- */
  .chartbox{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 18px 8px;margin-top:16px;
  }
  .chart-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
  .chart-head h2{font-size:15px;margin:0;font-weight:600}
  .chartbox+.chartbox{margin-top:14px}
  .toolbar{display:flex;margin-top:16px}
  .hint{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
  .toggle{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px}
  .toggle button{
    font-family:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);
    padding:6px 12px;border-radius:6px;cursor:pointer;
  }
  .toggle button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
  .canvas-holder{height:284px;position:relative}

  /* ---------- member table ---------- */
  .members{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tcard header{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;
  }
  .tcard header h3{margin:0;font-size:15px;font-weight:600}
  .tcard header .sum{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-2)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 18px;font-size:14px;border-bottom:1px solid var(--grid)}
  th{font-size:12.5px;color:var(--ink-2);font-weight:500}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
  .barcell{width:34%}
  .track{height:7px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
  .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
  .vs{font-size:16px;color:var(--ink-2);font-weight:500;margin-left:2px}
  .fill{height:100%;border-radius:4px}
  .tag{font-size:11.5px;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
  .tag-hi{background:var(--up-bg);color:var(--up)}
  .tag-lo{background:var(--down-bg);color:var(--down)}
  .tag-pm{background:var(--accent-bg);color:var(--accent)}
  .tag-solo{background:var(--soft);color:var(--ink-2)}
  .pmname{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
  .tag-as{background:var(--as-bg);color:var(--video)}
  .tag-etc{background:var(--etc-bg);color:var(--warn)}
  .empty{padding:18px;color:var(--ink-2);font-size:14px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button,.tabs a{font-family:inherit;font-size:15px;border:0;background:transparent;color:var(--ink-2);
    padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--video)}
  .tabs button:hover,.tabs a:hover{color:var(--ink)}
  .tabs a{margin-left:auto;color:var(--accent)}

  /* ---------- PM ---------- */
  .pm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:16px}
  .pm-bar .wk{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
  .pm-bar label{font-size:13.5px;color:var(--ink-2)}
  #pm-week{min-width:0;max-width:100%;flex:1}
  .pm-sum{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--ink-2)}
  .pm-sum b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-size:18px;margin-right:4px}
  .pm-card{margin-top:16px}
  .pm-scroll{overflow-x:auto}
  #pm-table th,#pm-table td{white-space:nowrap}
  #pm-table th{background:var(--th)}
  #pm-table td.pmc{font-weight:600;vertical-align:top;border-right:1px solid var(--grid)}
  #pm-table td.pmc small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
  #pm-table td.pmc small b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
  #pm-table tr.grand td{background:var(--accent-bg);font-weight:700;border-bottom:0}
  #pm-table td.it{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2)}
  #pm-table a.it-link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  #pm-table a.it-link:hover{border-bottom-color:currentColor}
  .game{--h:210;display:inline-block;font-size:13px;font-weight:500;padding:2px 9px;border-radius:999px;
    background:hsl(var(--h) var(--tag-bg));color:hsl(var(--h) var(--tag-fg));border:1px solid hsl(var(--h) var(--tag-bd))}
  .st{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--soft);color:var(--ink-2)}
  .st-prog{background:var(--prog-bg);color:var(--prog)}
  .st-done{background:var(--up-bg);color:var(--up)}
  /* ---------- Overview: PM × tuần ---------- */
  .ov-scroll{overflow-x:auto}
  #ov-table{border-collapse:separate;border-spacing:0}
  #ov-table th,#ov-table td{vertical-align:top;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:10px 12px}
  #ov-table th{background:var(--th);white-space:nowrap;font-size:12.5px}
  #ov-table th small{display:block;font-weight:400;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
  /* tuần hiện tại: đầu cột đặc màu + nhãn "Tuần này", cả cột có viền accent */
  #ov-table th.now,#cs-table th.now{background:var(--accent);color:var(--on-accent);font-weight:700}
  th.now .now-badge{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.92;margin-top:1px}
  #ov-table td.now,#cs-table td.now{background:var(--now-bg);box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
  #ov-table tr:last-child td.now,#cs-table tr:last-child td.now{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent),inset 0 -2px 0 var(--accent)}
  #ov-table .sticky{position:sticky;left:0;z-index:1;background:var(--panel);min-width:120px;font-weight:600;white-space:nowrap}
  #ov-table th.sticky{background:var(--th);z-index:2}
  #ov-table .sticky small{display:block;font-weight:400;font-size:12px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
  #ov-table td.cell{min-width:240px;max-width:300px}
  .ov-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;padding:4px 0;color:var(--ink);text-decoration:none;font-size:13px}
  .ov-item + .ov-item{border-top:1px dashed var(--dash)}
  a.ov-item:hover .ov-cr{text-decoration:underline}
  .ov-item .game{font-size:12px;padding:1px 8px}
  .ov-item .game{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov-cr{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov-n{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right;min-width:18px}
  .ov-plan{opacity:var(--faded)}
  .ov-sch{opacity:var(--faded);font-style:italic}
  .ov-sch .game{border:1px dashed currentColor}
  .game.etc-tag{background:var(--etc-bg);color:var(--warn)}
  .ov-empty{color:var(--muted)}
  #ov-table tr.grand td{background:var(--accent-bg);font-weight:700;font-family:"IBM Plex Mono",monospace}
  #ov-table tr.grand td.sticky{background:var(--accent-bg);font-family:inherit}

  /* PM × game */
  .gchips{display:flex;flex-wrap:wrap;gap:6px}
  .gchip{display:inline-flex;align-items:center;gap:5px}
  .gchip .gcr{font-size:12px;color:var(--ink-2)}
  .gchips{column-gap:14px}
  .gchip b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-weight:600}
  /* lịch 4-Week Loop ở tab Creator */
  .cs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-right:14px}
  .cs-head .ov-h{border-bottom:0;flex:1;min-width:0}
  #cs-table{border-collapse:separate;border-spacing:0}
  #cs-table th,#cs-table td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:7px 9px;white-space:nowrap;vertical-align:top}
  #cs-table th{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  #cs-table td.past{opacity:.72}
  #cs-table .sticky{position:sticky;left:0;z-index:1;background:var(--panel);font-weight:600}
  #cs-table th.sticky{background:var(--th);z-index:2;color:var(--ink)}
  .cs-mk{font-size:11px;margin-left:4px;font-weight:700}
  .cs-mk.ok{color:var(--up)} .cs-mk.diff{color:var(--warn)}
  .cs-names{font-size:12.5px;color:var(--ink)}
  .cs-pm{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
  .cs-pmi{font-size:11px;color:var(--ink-2)}
  .cs-pm.guess,.cs-pmi.guess{font-style:italic;opacity:.8}
  #cs-table td.cnt{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);text-align:right}

  /* đối chiếu 4-Week Loop Schedule */
  td.cell.bad{box-shadow:inset 3px 0 0 var(--warn)}
  td.cell.late{box-shadow:inset 3px 0 0 var(--down)}
  .ov-toggle{font:inherit;font-size:12.5px;font-weight:500;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;margin-left:6px}
  .ov-toggle:hover{background:var(--soft)}
  th.ov-more,td.ov-more{width:1%;white-space:nowrap}
  .ov-h{font-size:15px;font-weight:600;margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}

  .pm-note{margin-top:22px;color:var(--ink-2);font-size:12.5px;line-height:1.7}
  .pm-note a{color:var(--accent)}

  footer{margin-top:26px;color:var(--ink-2);font-size:12.5px;line-height:1.7}
  footer a{color:var(--video)}

  @media (max-width:820px){
    .headline{grid-template-columns:1fr}
    .members{grid-template-columns:1fr}
    .picker{margin-left:0;width:100%;flex-wrap:wrap}
    #week{flex:1 1 100%;min-width:0}
    #theme,#lang{flex:1 1 0;min-width:0}
    #lang{min-width:118px;font-weight:500}
  select{flex:1}
    .big{font-size:38px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Creative Weekly Tracker</h1>
      <p id="subtitle"></p>
      <p id="stamp" class="stamp"></p>
    </div>
    <div class="picker">
      <label for="week" id="lbl-week">Tuần</label>
      <select id="week"></select>
      <select id="theme" aria-label="Theme">
        <option value="auto"></option>
        <option value="light"></option>
        <option value="dark"></option>
      </select>
      <select id="lang" aria-label="Language">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-creator" aria-controls="view-creator" aria-selected="true" type="button"></button>
    <button role="tab" id="tab-pm" aria-controls="view-pm" aria-selected="false" type="button" tabindex="-1"></button>
    <button role="tab" id="tab-ov" aria-controls="view-ov" aria-selected="false" type="button" tabindex="-1"></button>
    <a id="tab-plan" target="_blank" rel="noopener noreferrer"></a>
  </nav>

  <div id="view-creator" role="tabpanel" aria-labelledby="tab-creator">
  <div class="headline" id="headline"></div>

  <div class="reading">
    <h2 id="why-title"></h2>
    <div id="reading"></div>
  </div>

  <div class="toolbar">
    <div class="toggle" role="group" aria-label="Chế độ xem biểu đồ">
      <button id="m-total" aria-pressed="true"></button>
      <button id="m-per" aria-pressed="false"></button>
      <button id="m-month" aria-pressed="false"></button>
    </div>
  </div>

  <div class="chartbox">
    <div class="chart-head">
      <h2><span class="swatch sw-v"></span>Video Ads Team &middot; <span id="chart-title"></span></h2>
      <span class="hint" id="hint-video"></span>
    </div>
    <div class="canvas-holder"><canvas id="chart-video"></canvas></div>
  </div>

  <div class="members">
    <div class="tcard" id="card-video"></div>
  </div>

  <div class="tcard pm-card" id="cs-card">
    <div class="cs-head"><h2 class="ov-h" id="cs-title"></h2>
      <div class="toggle" role="group" id="cs-mode">
        <button type="button" data-mode="creator" aria-pressed="true"></button>
        <button type="button" data-mode="game" aria-pressed="false"></button>
      </div>
    </div>
    <div class="ov-scroll" id="cs-scroll"><table id="cs-table"></table></div>
    <p class="pm-note" id="cs-note" style="padding:0 18px 14px;margin:0"></p>
  </div>

  <footer id="footer"></footer>
  </div>

  <div id="view-pm" role="tabpanel" aria-labelledby="tab-pm" hidden>
    <div class="pm-bar">
      <div class="wk"><label for="pm-week" id="lbl-pm-week"></label><select id="pm-week"></select></div>
      <div class="pm-sum" id="pm-sum"></div>
    </div>
    <div class="tcard pm-card"><div class="pm-scroll"><table id="pm-table"></table></div></div>
    <p class="pm-note" id="pm-note"></p>
  </div>

  <div id="view-ov" role="tabpanel" aria-labelledby="tab-ov" hidden>
    <div class="tcard pm-card"><h2 class="ov-h" id="ov-title"></h2><div class="ov-scroll" id="ov-scroll"><table id="ov-table"></table></div></div>
    <p class="pm-note" id="ov-note"></p>
  </div>

function gameHue(g){
  const i=GAME_ORDER.indexOf(g);
  if(i>=0) return Math.round((i*137.508+12)%360);

const escH=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Ngày bắt đầu của một Period, đọc từ "(MM/DD~)" trong tên.
function periodStart(name){
  const d=periodDate(name); if(!d) return null;
  const now=new Date(); let y=now.getFullYear();
  const start=new Date(y,d.m-1,d.d);
  if(start-now>180*864e5) start.setFullYear(y-1);
  if(now-start>185*864e5) start.setFullYear(y+1);
  return start;
}
function pmWeeks(){
  const set=[...new Set((TASKS||[]).map(t=>t.period))].filter(p=>periodStart(p));

}
// " · tuần này" / " · sắp tới" cho một Period, dùng chung cho ô chọn tuần của tab Creator và PM
function weekTag(p){
  const st=periodStart(p); if(!st) return "";
  const now=new Date(), end=new Date(st.getTime()+(/W\d+W\d+/.test(p)?14:7)*864e5);
  return now>=st&&now<end?T().pm.now:(st>now?T().pm.soon:"");

    .map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
  if(!rows.length){ table.innerHTML=`<tr><td class="empty">${T().pm.empty}</td></tr>`; return; }
  const NOPM="\u0000";

  rows.forEach(t=>{const k=t.pm||NOPM; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(t);});
  const keys=[...groups.keys()].sort((a,b)=>{
    if(a===NOPM) return 1; if(b===NOPM) return -1;
    const sa=groups.get(a).reduce((s,t)=>s+(t.count||0),0), sb=groups.get(b).reduce((s,t)=>s+(t.count||0),0);
    return sb-sa||a.localeCompare(b);
  });

  keys.forEach(k=>{

        <td>${gameTag(t.game)}</td>
        <td class="it">${href?`<a class="it-link" href="${href}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:label}</td>
        <td>${t.creators.length?t.creators.map(escH).join(", "):"—"}</td>
        <td class="num">${t.count??"—"}</td>
        <td>${stPill(t.status)}</td></tr>`;
    });

function csvRows(text){
  const rows=[];let row=[],cell="",q=false;
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}

  const dates=rows[hi].map((c,i)=>{ if(i<2) return null; const m=/(\d{1,2})[\/.](\d{1,2})\s*$/.exec(c.trim()); return m?`${+m[1]}/${+m[2]}`:null; });
  const people=rows.slice(hi+1).filter(r=>SCHEDULE_TEAM(r[0]||"")&&(r[1]||"").trim()).map(r=>{
    const byDate={}; dates.forEach((d,i)=>{ if(d) byDate[d]=(r[i]||"").trim(); });
    return {name:r[1].trim(), byDate};
  });
  if(!people.length) throw new Error("no rows");
  const cols=dates.filter(Boolean).map(k=>({key:k, start:periodStart(`(${k}~)`)})).filter(c=>c.start);
  return {live, people, cols};
}
async function loadSchedule(){
  for(const [url,live] of [[SCHEDULE_URL,true],["data/schedule.csv",false]]){
    try{
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok) continue;
      SCHEDULE=parseSchedule(await res.text(),live);
      break;
    }catch(e){}
  }
  SCHEDULE_DONE=true;
}
// Tên game trong Sheet viết hơi khác Notion ("Themepark Manager", "Crab Life", "Dinosaur Universe", "(YT) …")
const gameKey=g=>{const k=String(g||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]/g,""); return ({dinosauruniverse:"dinouniverse"})[k]||k;};
const toNotionGame=g=>GAME_ORDER.find(x=>gameKey(x)===gameKey(g))||String(g||"").trim();
const isBlank=g=>!g||/^[-—–]+$/.test(g.trim());
// Lịch của 1 creator cho 1 Period: cột trùng ngày bắt đầu; kỳ gộp 2 tuần (W1W2) lấy ô không trống đầu tiên trong 2 cột.
function scheduledFor(person,period){
  const st=periodStart(period); if(!st) return "";
  const span=/W\d+W\d+/.test(period)?2:1;
  for(let k=0;k<span;k++){
    const d=new Date(st.getTime()+k*7*864e5), v=person.byDate[`${d.getMonth()+1}/${d.getDate()}`];
    if(!isBlank(v)) return v;
  }
  return "";
}
// Lịch 4-Week Loop ở tab Creator: nguyên lưới của Sheet (creator × tuần) hoặc đảo lại (game × tuần → creator)
let CS_MODE="creator";
// cột của Sheet ↔ Period trên Notion: cùng ngày bắt đầu, hoặc là tuần thứ 2 của kỳ gộp W1W2
function periodForCol(col){
  return ALL_TASKS?[...new Set(ALL_TASKS.map(t=>t.period))].find(pp=>{
    const st=periodStart(pp); if(!st) return false;
    if(+st===+col.start) return true;
    return /W\d+W\d+/.test(pp)&&+new Date(st.getTime()+7*864e5)===+col.start;
  }):null;
}
// PM của ô lịch: lấy từ task Notion cùng tuần + creator + game; nếu chưa có task thì đoán
// theo lần gần nhất creator đó làm game đó, rồi tới lần gần nhất có ai làm game đó.
function pmForCell(name,col,sch){
  if(!ALL_TASKS||isBlank(sch)||/^etc$/i.test(sch)) return null;
  const k=gameKey(sch), ok=t=>t.pm&&!HIDDEN_PM.includes(t.pm)&&gameKey(t.game)===k;
  const p=periodForCol(col);
  const real=p&&ALL_TASKS.find(t=>t.period===p&&t.creators.includes(name)&&ok(t));
  if(real) return {pm:real.pm,guess:false};
  const latest=list=>list.sort((a,b)=>(+periodStart(b.period)||0)-(+periodStart(a.period)||0))[0];
  const g=latest(ALL_TASKS.filter(t=>ok(t)&&t.creators.includes(name)))||latest(ALL_TASKS.filter(ok));
  return g?{pm:g.pm,guess:true}:null;
}
function notionStatus(name,col,sch){
  const p=TASKS?periodForCol(col):null;
  if(!p||isBlank(sch)||/^etc$/i.test(sch)) return "";
  const ts=ALL_TASKS.filter(t=>t.period===p&&t.creators.includes(name));
  if(!ts.length) return "";
  return ts.some(t=>gameKey(t.game)===gameKey(sch))?"ok":"diff";
}

// ---------------------------------------------------------------- helpers
function roster(team,i){
  return Object.entries(team.people)
    .filter(([,arr])=>arr[i]!==null && arr[i]!==undefined)
    .map(([name,arr])=>({name,v:arr[i]}));
}
function totalOf(team,i){
  const r=roster(team,i);
  return r.length ? r.reduce((s,p)=>s+p.v,0) : null;
}
function headOf(team,i){return roster(team,i).length}
function avgOf(team,i){const t=totalOf(team,i),h=headOf(team,i);return h?t/h:null}
// Video Ads: đúng 12 = có dev/art tham gia; trên 12 = creator tự làm vượt mức.
// Miko luôn 12 vì làm ETC nên không tính là có hỗ trợ.
// Một số kỳ gộp nhiều tuần nên chỉ tiêu và ngưỡng dev/art đều dịch lên cùng một mức.
function bonusAt(i){return WEEKS[i].bonus||0}
// Kỳ đặc biệt chỉnh chỉ tiêu của ETC riêng: kỳ gộp thì ETC giữ nguyên (bonusEtc = 0),
// còn tuần nghỉ lễ thì ETC giảm cùng mức với cả đội.
function bonusEtcAt(i){return WEEKS[i].bonusEtc||0}
function quotaAt(team,i){return team.quota+bonusAt(i)}
// Vai trò ETC có chuẩn riêng (12) và không nhận phần cộng thêm của kỳ gộp.
function quotaFor(team,name,i){
  return name===team.etc
    ? (team.etcQuota||team.quota)+bonusEtcAt(i)
    : quotaAt(team,i);
}
function supportAt(team,i){return team.support?team.support+bonusAt(i):null}
// Tên PM đi cùng người này trong kỳ i (chuỗi rỗng = không có PM, tức làm solo).
function pmOf(team,name,i){
  const a=team.pm&&team.pm[name];
  return (a&&a[i])||"";
}
// Hai chiều độc lập:
//  1. Theo SỐ LƯỢNG: dưới chỉ tiêu / đạt chuẩn / vượt mức / có dev/art (đúng mốc) / ETC.
//     Vượt mức = hơn chuẩn nhưng không trùng mốc dev/art, nên 9–11 video cũng là vượt mức.
//  2. Theo PM: có PM = làm chung; không có PM nào = tự làm (solo).
// Một người có thể vừa vượt mức vừa có PM.
function kindOf(team,name,v,i){
  const q=quotaFor(team,name,i), sup=supportAt(team,i);
  if(name===team.etc) return "etc";
  if(sup&&v===sup) return "assisted";
  if(v<q) return "under";
  if(v>q) return "over";
  return "solo";                                  // đúng bằng chuẩn
}
function layerOf(team,name,v,i){
  const k=kindOf(team,name,v,i);
  return k==="under"?"solo":k;                    // dưới chuẩn gộp vào lớp "trong chuẩn"
}
const KIND={under:{tag:"tag-lo"},solo:{tag:""},assisted:{tag:"tag-as"},pm:{tag:"tag-pm"},
            over:{tag:"tag-hi"},etc:{tag:"tag-etc"}};
function splitOf(team,i){
  const out={under:0,solo:0,assisted:0,over:0,etc:0,pm:0,nAssisted:0,nOver:0,nPM:0};
  roster(team,i).forEach(p=>{
    const k=kindOf(team,p.name,p.v,i);
    out[layerOf(team,p.name,p.v,i)]+=p.v;
    if(k==="assisted") out.nAssisted++;
    if(k==="over") out.nOver++;
    if(pmOf(team,p.name,i)) out.nPM++;
  });
  return out;
}
// Kỳ đang diễn ra = hôm nay chưa qua hết kỳ đó. Kỳ gộp dạng "W1W2" kéo dài 2 tuần.
function periodRange(i){
  const w=WEEKS[i]; if(!w) return null;
  const m=/\((\d{1,2})\/(\d{1,2})/.exec(w.full||"");
  if(!m) return null;
  const now=new Date();
  let y=now.getFullYear();
  const start=new Date(y,+m[1]-1,+m[2]);
  if(start-now>180*864e5) start.setFullYear(y-1);      // kỳ cuối năm trước
  const days=/W\d+W\d+/.test(w.full)?14:7;
  const end=new Date(start.getTime()+days*864e5);
  return {start,end};
}
function isOngoing(i){
  const r=periodRange(i); if(!r) return false;
  const now=new Date();
  return now<r.end;
}

function monthStats(team,m){
  const ws=m.weeks.filter(i=>totalOf(team,i)!==null);
  if(!ws.length) return null;
  const tot=ws.reduce((s,i)=>s+totalOf(team,i),0);
  const tgt=ws.reduce((s,i)=>s+targetOf(team,i),0);
  const per=ws.reduce((s,i)=>s+avgOf(team,i),0)/ws.length;
  return {weeks:ws.length,total:tot,avgWeek:tot/ws.length,avgPerson:per,hit:tot/tgt};
}
function monthOfWeek(i){return MONTHS.find(m=>m.weeks.includes(i))}
function targetOf(team,i){return roster(team,i).reduce((s,p)=>s+quotaFor(team,p.name,i),0)}
function hitOf(team,i){const t=totalOf(team,i),g=targetOf(team,i);return (t===null||!g)?null:t/g}
function fmt(n,d=1){return n===null||n===undefined?"—":(Math.round(n*10**d)/10**d).toString()}
function signed(n,d=0){const s=fmt(Math.abs(n),d);return (n>0?"+":n<0?"−":"±")+s}
function cls(n){return n>0?"up":n<0?"down":"flat"}

// ---------------------------------------------------------------- headline
function renderHeadline(i){
  const prev=i-1;
  // Tổng chỉ cộng các đội đang hiển thị, và chỉ so sánh khi cả hai tuần đều có số.
  let grand=0, base=0, prevSum=0, comparable=false;
  TEAMS.forEach(t=>{
    const now=totalOf(t,i);
    if(now!==null) grand+=now;
    if(prev>=0){
      const before=totalOf(t,prev);
      if(now!==null&&before!==null){base+=now;prevSum+=before;comparable=true;}
    }
  });
  const d=comparable?base-prevSum:null;

  const cells=[`<div class="cell">
      <div class="k">${isOngoing(i)?T().grandNow:T().grand}</div>
      <div class="big">${grand}</div>
      ${d===null
        ? `<div class="delta flat">${prev<0?T().firstWeek:T().noPrev}</div>`
        : `<div class="delta ${cls(d)}">${T().vsWeek(signed(d),wkLabel(prev),prevSum?` (${signed(d/prevSum*100,0)}%)`:"")}</div>`}
      ${isOngoing(i)?`<div class="delta note">${T().ongoing}</div>`:""}
      ${bonusAt(i)?`<div class="delta note">${T().mergedNote(bonusAt(i),bonusEtcAt(i)!==0)}</div>`:""}
    </div>`];

  TEAMS.forEach(t=>{
    const now=totalOf(t,i), before=prev>=0?totalOf(t,prev):null;
    const dd=(now===null||before===null)?null:now-before;
    const h=headOf(t,i), a=avgOf(t,i), g=targetOf(t,i), hit=hitOf(t,i);
    cells.push(`<div class="cell">
      <div class="k"><span class="swatch sw-v"></span>${t.name}</div>
      <div class="mid">${now===null?T().notEntered:now}<span class="vs">${now===null?"":T().needed(g)}</span></div>
      <div class="delta ${hit===null?"flat":(hit>=1?"up":"down")}">
        ${hit===null?T().noCount:T().attain(Math.round(hit*100),fmt(a),quotaAt(t,i))}
      </div>
      <div class="delta flat" style="margin-top:3px">
        ${dd===null?T().noPrev:T().vsPrev(signed(dd),h)}
      </div>
      ${t.support&&now!==null?(()=>{const sp=splitOf(t,i);
        return `<div class="delta flat" style="margin-top:3px">
          ${T().assistLine(sp.nAssisted,sp.assisted,sp.nOver)}${sp.nPM?" · "+T().pmLine(sp.nPM,roster(t,i).length):""}
        </div>`;})():""}
    </div>`);
  });
  if(WEEKS[i].note) cells[0]=cells[0].replace("</div>`","</div>`");
  const hl=document.getElementById("headline");
  hl.style.gridTemplateColumns="1.15fr "+"1fr ".repeat(TEAMS.length);
  hl.innerHTML=cells.join("");
}

// ---------------------------------------------------------------- vì sao
function renderReading(i){
  const box=document.getElementById("reading");
  if(i===0){box.innerHTML=`<p style="margin:0;font-size:14px;color:var(--ink-2)">Đây là tuần đầu tiên có dữ liệu Video Count nên chưa có tuần trước để so sánh.</p>`;return;}
  const prev=i-1;
  const out=TEAMS.map(t=>{
    const now=totalOf(t,i), before=totalOf(t,prev);
    if(now===null||before===null){
      return `<div class="why"><div class="team">${t.name}</div>
        <p style="color:var(--ink-2)">Tuần này chưa nhập Video Count nên không tính được chênh lệch. Nhập số vào Notion là bảng tự cập nhật.</p></div>`;
    }
    const dTot=now-before;
    const h1=headOf(t,i), h0=headOf(t,prev);
    const a1=avgOf(t,i),  a0=avgOf(t,prev);
    const effHead=(h1-h0)*a0;          // do thay đổi nhân sự
    const effRate=h1*(a1-a0);          // do năng suất mỗi người

    // ai đóng góp mức chênh lớn nhất
    const movers=[];
    Object.entries(t.people).forEach(([name,arr])=>{
      const a=arr[i], b=arr[prev];
      if(a===null&&b===null) return;
      const d=(a||0)-(b||0);
      if(d!==0) movers.push({name,d,joined:b===null,left:a===null});
    });
    movers.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));

    let verdict;
    if(dTot===0) verdict=T().vFlat;
    else if(Math.abs(effHead)>=Math.abs(effRate)*1.5)
      verdict=T().vHead(h0,h1);
    else if(Math.abs(effRate)>=Math.abs(effHead)*1.5)
      verdict=T().vRate(fmt(a0),fmt(a1));
    else
      verdict=T().vBoth(h0,h1,fmt(a0),fmt(a1));

    const hit1=hitOf(t,i), hit0=hitOf(t,prev);
    const quotaLine=`<p style="color:var(--ink-2);font-size:13.5px">
        ${T().quotaLine(quotaAt(t,i),targetOf(t,i),now,Math.round(hit1*100),Math.round(hit0*100))}
      </p>`;
    let supLine="";
    if(t.support){
      const s1=splitOf(t,i), s0=splitOf(t,prev);
      const dAss=s1.assisted-s0.assisted;
      supLine=`<p style="color:var(--ink-2);font-size:13.5px">
        ${T().supLine(supportAt(t,i),s0.nAssisted,s1.nAssisted,s0.assisted,s1.assisted,signed(dAss),s0.nOver,s1.nOver,t.etc,t.people[t.etc][prev]??"—",t.people[t.etc][i]??"—")}
      </p>`;
    }
    const chips=movers.slice(0,4).map(m=>{
      const note=m.joined?T().joined:m.left?T().left:"";
      return `<span class="chip">${m.name} <b class="${cls(m.d)}">${signed(m.d)}</b>${note}</span>`;
    }).join("");

    return `<div class="why">
      <div class="team">${t.name}<span class="n">${T().teamHead(before,now,signed(dTot))}</span></div>
      <p>${verdict}</p>
      <p style="color:var(--ink-2);font-size:13.5px">
        ${T().splitLine(signed(effHead,1),signed(effRate,1))}
      </p>
      ${quotaLine}
      ${supLine}
      ${chips?`<div class="bars">${chips}</div>`:""}
    </div>`;
  }).join("");
  box.innerHTML=out;
}

function stackData(t){
  // 4 lớp theo số lượng: trong chuẩn / vượt mức / có dev/art / ETC. PM xem ở bảng và phần đầu.
  const keys=["solo","over","assisted","etc"];
  const acc={};keys.forEach(k=>acc[k]=[]);
  WEEKS.forEach((_,i)=>{
    if(totalOf(t,i)===null){keys.forEach(k=>acc[k].push(null));return;}
    const sp=splitOf(t,i);
    acc.solo.push(sp.solo);
    acc.over.push(sp.over);
    acc.assisted.push(sp.assisted);
    acc.etc.push(sp.etc);
  });
  return acc;
}
function plainData(t){
  return WEEKS.map((_,i)=> mode==="total"
    ? totalOf(t,i)
    : (avgOf(t,i)===null?null:Math.round(avgOf(t,i)*10)/10));
}
function targetSeries(t){
  return WEEKS.map((_,i)=> totalOf(t,i)===null ? null
    : (mode==="total" ? targetOf(t,i)
       : Math.round(targetOf(t,i)/headOf(t,i)*10)/10));
}
function monthBars(t){
  return MONTHS.map(m=>{const st=monthStats(t,m);return st?Math.round(st.avgWeek*10)/10:null});
}
function monthTargets(t){
  return MONTHS.map(m=>{
    const ws=m.weeks.filter(i=>totalOf(t,i)!==null);
    if(!ws.length) return null;
    return Math.round(ws.reduce((s,i)=>s+targetOf(t,i),0)/ws.length*10)/10;
  });
}
function datasetsFor(t){
  if(mode==="month"){
    return [
      {label:T().ds.monthBar,data:monthBars(t),
       backgroundColor:getCSS("--warn"),borderRadius:3,barPercentage:.55,categoryPercentage:.8,order:2},
      {type:"line",label:T().ds.monthTgt(t.quota),
       data:monthTargets(t),borderColor:getCSS("--ink"),borderWidth:1.5,borderDash:[5,4],
       pointRadius:0,pointHoverRadius:0,fill:false,tension:0,order:0}

  const line={
    type:"line",label:T().ds.weekTgt(t.quota),
    data:targetSeries(t),borderColor:getCSS("--ink"),borderWidth:1.5,borderDash:[5,4],
    pointRadius:0,pointHoverRadius:0,fill:false,tension:0,order:0
  };
  if(t.support && mode==="total"){
    const d=stackData(t);
    return [
      {label:T().ds.solo,      data:d.solo,     backgroundColor:t.color,        stack:"s",order:2,borderRadius:{topLeft:0,topRight:0}},
      {label:T().ds.over,    data:d.over,     backgroundColor:SHADE.over,     stack:"s",order:2},
      {label:T().ds.assisted,  data:d.assisted, backgroundColor:SHADE.assisted, stack:"s",order:2},
      {label:T().ds.etc(t.etc),  data:d.etc,      backgroundColor:SHADE.etc,      stack:"s",order:2,borderRadius:3},
      line

  }
  return [
    {label:"Video hoàn thành",data:plainData(t),backgroundColor:t.color,
     borderRadius:3,barPercentage:.68,categoryPercentage:.8,order:2},
    line
  ];
}

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else if(c==='"') q=true;
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>{
    const o={};head.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;
  });
}

// "[W3] Sep W4 (09/21~)" -> {m:9,d:21}
function periodDate(name){
  const m=/\((\d{1,2})\/(\d{1,2})/.exec(name||"");
  return m?{m:+m[1],d:+m[2]}:null;
}
const MONTH_VI=n=>`Tháng ${n}`;

function importCSV(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error("empty");
  const need=["Period","Team","Creator","Video Count"];
  const miss=need.filter(h=>!(h in rows[0]));
  if(miss.length) throw new Error("cols:"+miss.join(", "));

  const team=TEAMS[0];
  const mine=rows.filter(r=>r.Team===team.name);        // chỉ đội đang theo dõi
  if(!mine.length) throw new Error("noteam:"+team.name);

  const known=WEEKS.map(w=>w.full);
  const lastKnown=periodDate(known[known.length-1])||{m:0,d:0};
  const dayOf=d=>d.m*30.5+d.d;
  const base=dayOf(lastKnown);

  // Chỉ nhận kỳ mới nằm trong khoảng 120 ngày sau kỳ cuối đã biết. Nhờ vậy các kỳ
  // cũ (tháng 4, tháng 5 chưa nhập Video Count) không bị kéo ngược vào bảng.
  const seen=new Set(), fresh=[];
  mine.forEach(r=>{
    const p=r.Period;
    if(!p||seen.has(p)||known.includes(p)) return;
    seen.add(p);
    const d=periodDate(p);
    if(!d) return;
    // Kỳ chưa bắt đầu chỉ là kế hoạch nhập trước (Creative Planner) — không tính vào sản lượng.
    const st=periodStart(p);
    if(st&&st>new Date()) return;
    let gap=dayOf(d)-base;
    if(gap<0) gap+=365;
    if(gap>0&&gap<=120) fresh.push(p);
  });
  fresh.sort((a,b)=>{
    const ga=(dayOf(periodDate(a))-base+365)%365;
    const gb=(dayOf(periodDate(b))-base+365)%365;
    return ga-gb;
  });

  const order=[...known,...fresh];
  const idx=Object.fromEntries(order.map((p,i)=>[p,i]));
  const people={}, pms={}, warn=[], noCount=[];
  const hasPMcol = "PM" in rows[0];
  // Ô PM trống, "[]" hay "null" đều nghĩa là không có PM — task đó tính là solo.
  const cleanPM=v=>{v=(v||"").trim();return (v===""||v==="[]"||v.toLowerCase()==="null")?"":v;};

  mine.forEach(r=>{
    if(!r.Period||idx[r.Period]===undefined) return;
    const creators=r.Creator.split(",").map(x=>x.trim()).filter(Boolean);
    if(!creators.length) return;
    const raw=r["Video Count"];
    if(!raw){ noCount.push(`${r.Period} / ${creators.join(", ")}`); return; }
    let n;
    if(/^\d+$/.test(raw)) n=+raw;
    else { const m=/\d+/.exec(raw); if(!m) return; n=+m[0]; warn.push(`${r.Period} · ${creators[0]}: "${raw}"`); }
    const share=n/creators.length;
    const pm=hasPMcol?cleanPM(r.PM):"";
    creators.forEach(c=>{
      people[c]=people[c]||new Array(order.length).fill(null);
      people[c][idx[r.Period]]=(people[c][idx[r.Period]]||0)+share;
      if(pm){
        pms[c]=pms[c]||new Array(order.length).fill("");
        const cur=pms[c][idx[r.Period]];
        const set=new Set(cur?cur.split(", "):[]);
        pm.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>set.add(x));
        pms[c][idx[r.Period]]=[...set].join(", ");
      }
    });
  });

  const names=Object.keys(people);
  if(!names.length) throw new Error("nodata");
  names.forEach(c=>people[c]=people[c].map(v=>v===null?null:Math.round(v)));

  let last=order.length;
  while(last>0&&!names.some(c=>people[c][last-1]!==null)) last--;

  const newWeeks=order.slice(0,last).map(full=>{
    const old=WEEKS.find(w=>w.full===full);
    if(old) return old;                                  // giữ nguyên bonus, bonusEtc, label
    const d=periodDate(full);
    return {label:`Tuần ${String(d.d).padStart(2,"0")}/${String(d.m).padStart(2,"0")}`, full};
  });

  const bucket={}, newMonths=[];
  newWeeks.forEach((w,i)=>{
    const key=`Tháng ${(periodDate(w.full)||{m:0}).m}`;
    if(!(key in bucket)){bucket[key]=newMonths.length;newMonths.push({label:key,weeks:[]});}
    newMonths[bucket[key]].weeks.push(i);
  });

  const sorted={};
  names.sort((a,b)=>{
    const sa=people[a].slice(0,last).reduce((s,v)=>s+(v||0),0);
    const sb=people[b].slice(0,last).reduce((s,v)=>s+(v||0),0);
    return sb-sa;
  }).forEach(c=>sorted[c]=people[c].slice(0,last));

  const pmOut={};
  Object.keys(sorted).forEach(c=>{ if(pms[c]) pmOut[c]=pms[c].slice(0,last); });
  // Chi tiết từng task cho tab PM — chỉ có khi CSV mang thêm cột Game Title (định dạng mới).
  const tasks=("Game Title" in rows[0])?mine.filter(r=>r.Period&&periodDate(r.Period)).map(r=>({
    period:r.Period, pm:cleanPM(r.PM), game:r["Game Title"]||"", iteration:r.Iteration||"",
    creators:(r.Creator||"").split(",").map(x=>x.trim()).filter(Boolean),
    count:/^\d+$/.test(r["Video Count"]||"")?+r["Video Count"]:null,
    status:r.Status||"", pageId:r["Page ID"]||""})):null;
  return {weeks:newWeeks,months:newMonths,people:sorted,pm:pmOut,hasPMcol,warn,noCount,
          tasks:tasks&&tasks.filter(t=>!HIDDEN_PM.includes(t.pm)), allTasks:tasks,
          fresh:fresh.filter(f=>order.indexOf(f)<last)};
}

function applyImport(res){
  WEEKS.length=0; res.weeks.forEach(w=>WEEKS.push(w));
  MONTHS.length=0; res.months.forEach(m=>MONTHS.push(m));
  const t=TEAMS[0];
  Object.keys(t.people).forEach(k=>delete t.people[k]);
  Object.entries(res.people).forEach(([k,v])=>t.people[k]=v);
  // CSV cũ chưa có cột PM thì giữ nguyên thông tin PM đang nhúng, đừng xoá trắng.
  if(res.hasPMcol){
    t.pm={}; Object.entries(res.pm).forEach(([k,v])=>t.pm[k]=v);
  }
  const sel=document.getElementById("week");
  sel.innerHTML="";
  WEEKS.forEach((w,i)=>{const o=document.createElement("option");o.value=i;sel.appendChild(o);});
  sel.value=WEEKS.length-1;
}

// Nếu repo có data/latest.csv thì lấy số từ đó, coi như nguồn mới nhất.
// Không có hoặc lỗi thì dùng khối dữ liệu nhúng sẵn — trang vẫn chạy bình thường.
async function loadLiveCSV(){
  let res;
  try{
    res=await fetch("data/latest.csv",{cache:"no-store"});
    if(!res.ok) return null;
  }catch(e){ return null; }          // mở bằng file:// hoặc chưa có file
  const text=await res.text();
  let parsed;
  try{ parsed=importCSV(text); }
  catch(e){ console.warn("data/latest.csv không đọc được:",e.message); return null; }
  applyImport(parsed);
  TASKS=parsed.tasks; ALL_TASKS=parsed.allTasks;
  const lm=res.headers.get("last-modified");
  const when=lm?new Date(lm):new Date();
  return {stamp:when.toISOString().slice(0,16).replace("T"," ")+" UTC",
          fresh:parsed.fresh};
}

// ---------------------------------------------------------------- wiring
const sel=document.getElementById("week");
WEEKS.forEach((w,i)=>{
  const o=document.createElement("option");
  o.value=i;sel.appendChild(o);
});
sel.value=WEEKS.length-1;

const MODE_BTN={total:"m-total",per:"m-per",month:"m-month"};

function applyLang(){
  document.documentElement.lang=LANG;
  document.getElementById("lbl-week").textContent=T().weekPicker;
  document.getElementById("why-title").textContent=T().whyTitle;
  document.getElementById("subtitle").textContent=
    TEAMS.map(t=>t.name).join(" & ")+" · "+T().source;
  document.getElementById("footer").innerHTML=T().footer;
  document.getElementById("tab-creator").textContent=T().tab.creator;
  document.getElementById("tab-pm").textContent=T().tab.pm;
  document.getElementById("tab-ov").textContent=T().tab.ov;
  const plan=document.getElementById("tab-plan");
  plan.textContent=T().tab.plan; plan.href=PLANNER_URL;
  if(VIEW==="pm") renderPM();
  if(VIEW==="ov") renderOV();
  Object.entries(MODE_BTN).forEach(([k,id])=>
    document.getElementById(id).textContent=T().btn[k]);
  [...sel.options].forEach((o,i)=>{if(WEEKS[i])o.textContent=`${wkLabel(i)}${weekTag(WEEKS[i].full)} — ${WEEKS[i].full}`;});
  const th=document.getElementById("theme");
  th.setAttribute("aria-label",T().theme.label);
  [...th.options].forEach(o=>o.textContent=T().theme[o.value]);
  const st=document.getElementById("stamp");
  if(st){
    const d=LIVE?LIVE.stamp:DATA_STAMP;
    st.textContent=d?T().stamp(d):"";
    if(LIVE&&LIVE.fresh&&LIVE.fresh.length)
      st.textContent+=" · "+T().freshWarn(LIVE.fresh.join(", "));
  }
}

function update(){
  const i=+sel.value;
  renderHeadline(i);renderReading(i);renderMembers(i);
}
sel.addEventListener("change",update);

function setMode(m){
  mode=m;
  Object.entries(MODE_BTN).forEach(([k,id])=>
    document.getElementById(id).setAttribute("aria-pressed",k===m));
  refreshCharts();
}
Object.entries(MODE_BTN).forEach(([k,id])=>
  document.getElementById(id).addEventListener("click",()=>setMode(k)));

const langSel=document.getElementById("lang");
langSel.value=LANG;
langSel.addEventListener("change",()=>{
  LANG=langSel.value;
  applyLang();
  refreshCharts();
  update();
  renderCreatorSchedule();
});

let LIVE=null;
// ---------------------------------------------------------------- giao diện sáng / tối
const THEME_KEY="ct-theme";
function applyTheme(v){
  if(v==="light"||v==="dark") document.documentElement.setAttribute("data-theme",v);
  else document.documentElement.removeAttribute("data-theme");
  document.getElementById("theme").value=["light","dark"].includes(v)?v:"auto";
}
function repaint(){ if(Object.keys(charts).length) refreshCharts(); update(); renderCreatorSchedule(); if(VIEW==="pm") renderPM(); if(VIEW==="ov") renderOV(); }
(()=>{ let v=null; try{ v=localStorage.getItem(THEME_KEY); }catch(e){} applyTheme(v); })();
document.getElementById("theme").addEventListener("change",e=>{
  applyTheme(e.target.value);
  try{ localStorage.setItem(THEME_KEY,e.target.value); }catch(err){}
  repaint();
});
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
  if(!document.documentElement.hasAttribute("data-theme")) repaint();
});
document.getElementById("tab-creator").addEventListener("click",()=>showView("creator"));
document.getElementById("tab-pm").addEventListener("click",()=>showView("pm"));
document.getElementById("tab-ov").addEventListener("click",()=>showView("ov"));
document.querySelector(".tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;
  const order=["creator","pm","ov"], i=order.indexOf(VIEW);
  const next=order[(i+(e.key==="ArrowRight"?1:order.length-1))%order.length];
  showView(next); document.getElementById("tab-"+next).focus();
});
document.getElementById("pm-week").addEventListener("change",e=>{pmWeek=e.target.value;renderPM();});
function boot(){
  applyLang(); buildCharts(); update(); renderCreatorSchedule();
  let v=location.hash==="#pm"?"pm":location.hash==="#overview"?"ov":null;
  if(!v){ try{ v=localStorage.getItem("ct-view"); }catch(e){} }
  showView(["pm","ov"].includes(v)?v:"creator");
}

loadLiveCSV().then(r=>{
  if(r){ LIVE=r; }
  boot();
}).catch(()=>boot());
loadSchedule().then(()=>{ if(VIEW==="ov") renderOV(); renderCreatorSchedule(); });
</script>
